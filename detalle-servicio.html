<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Detalle de Servicio - SIMIVOZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Leaflet.js CSS and JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  padding-bottom: 7rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.detail-card {
  padding: 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  width: 100%;
  position: relative;
  overflow: hidden;
}

.detail-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--primary) 0%, transparent 100%);
  opacity: 0.6;
}

.badge-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.category-badge {
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 800;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  padding: 0.25rem 0.75rem;
  border-radius: 99px;
  text-transform: uppercase;
}

.open-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--primary);
  font-weight: 700;
  font-size: 0.8rem;
}

.service-title {
  font-size: 1.65rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.service-address {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.service-address svg {
  color: var(--primary);
  flex-shrink: 0;
  margin-top: 2px;
}

.stats-row {
  display: flex;
  gap: 1rem;
  width: 100%;
}

.stat-box {
  flex: 1;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  padding: 0.75rem;
  border-radius: 0.75rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0.25rem;
}

.stat-box span.stat-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
}

.stat-box span.stat-value {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--primary);
}

/* Local view image box */
.image-box {
  position: relative;
  width: 100%;
  height: 140px;
  border-radius: 1rem;
  overflow: hidden;
  border: 1px solid var(--outline);
}

.image-box img {
  width: 100%;
  height: 100%;
  object-cover: cover;
  filter: brightness(0.7);
}

.image-label {
  position: absolute;
  bottom: 0.75rem;
  left: 0.75rem;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(4px);
  padding: 0.25rem 0.5rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  color: var(--text);
  border: 1px solid var(--outline);
}

/* Action button row */
.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  width: 100%;
}

.btn-detail-action {
  width: 100%;
  height: 60px;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}

.btn-detail-secondary {
  width: 100%;
  height: 60px;
  border: 2px solid var(--primary);
  color: var(--primary);
  background: transparent;
  border-radius: 0.75rem;
  font-family: var(--font-base);
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  box-shadow: 0 4px 12px var(--primary-glow);
}

.btn-detail-secondary:hover {
  background: rgba(0, 168, 84, 0.05);
}

.btn-detail-secondary:active {
  transform: scale(0.97);
}

.btn-detail-back {
  width: 100%;
  height: 52px;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  color: var(--text-secondary);
  border-radius: 0.75rem;
  font-family: var(--font-base);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.btn-detail-back:hover {
  border-color: var(--primary);
  color: var(--text);
}

/* Map area */
.exact-map-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.exact-map-section h3 {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
}

.detail-map-wrapper {
  width: 100%;
  height: 240px;
  border-radius: 1.25rem;
  overflow: hidden;
  border: 1px solid var(--surface-border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

#map {
  width: 100%;
  height: 100%;
  background: var(--bg);
}

/* Simplify modifications */
body.modo-simplificado .stats-row, body.modo-simplificado .image-box {
  display: none;
}
body.modo-simplificado .btn-detail-action, body.modo-simplificado .btn-detail-secondary {
  height: 80px;
  font-size: 1.35rem;
}
</style>
<script src="js/app.js"></script>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header">
  <div class="logo-wrapper">
    <button onclick="history.back()" class="btn-icon-header" style="border:none" aria-label="Volver atrás">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size: 1.25rem; margin-left: 0.5rem;">Detalle</h1>
  </div>
  <button class="btn-icon-header" onclick="location.href='configuracion.html'" aria-label="Ajustes y accesibilidad">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="detail-card glass-card" aria-live="polite">
    <div class="badge-row">
      <span class="category-badge" id="service-category">Farmacia</span>
      <span class="open-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Abierto ahora
      </span>
    </div>

    <h2 class="service-title" id="service-name">Cargando...</h2>

    <p class="service-address">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="service-address">Cargando ubicación...</span>
    </p>

    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-label">DISTANCIA</span>
        <span class="stat-value" id="distance-display">-- m</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">TIEMPO ESTIMADO</span>
        <span class="stat-value" id="time-display">-- min</span>
      </div>
    </div>

    <div class="image-box">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-jUt7n7cPJAbRcQZiqUD2_eMZezJyV5WDhoIKXncacu_wq73X3IfOB6af4EoABjQAu25eW_4p1ocm-Ul9gkQ49V8qL60h2o_dN81cw57CJNZGv3Yc853SrovHLVoGy2TE79s-rilWBkF0SyznWYvA-sZSnNrUPRWAijGgkK0uACh2psc6q73Klwj3xI4iwWx_NpbLhHePhBC8WgymncML6ynGiTXmqMJjA4jMqlFH52Oy6uDCFArr_fd-7C6YbDpOIuuQ3LRBE7UT" alt="Interior del establecimiento accesible">
      <div class="image-label">Establecimiento Acreditado</div>
    </div>
  </div>

  <div class="action-buttons">
    <button onclick="getDirections()" class="btn-primary-action btn-detail-action" aria-label="Abrir indicaciones de ruta en mapa externo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>INDICACIONES</span>
    </button>
    
    <button onclick="callService()" class="btn-detail-secondary" aria-label="Llamar por teléfono al establecimiento">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>LLAMAR</span>
    </button>

    <button onclick="history.back()" class="btn-detail-back" aria-label="Volver a los resultados de búsqueda">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>VOLVER</span>
    </button>
  </div>

  <section class="exact-map-section">
    <h3>Ubicación en el mapa</h3>
    <div class="detail-map-wrapper">
      <div id="map"></div>
    </div>
  </section>
</main>

<script>
var servicios = [
  { id: 1, nombre: 'Farmacia Central "San José"', direccion: 'Av. Constitución 124, Miraflores, Lima', categoria: 'FARMACIA', lat: -12.121, lng: -77.029, telefono: '+51 1 234 5678', desc: 'Establecimiento adaptado con rampas para sillas de ruedas y personal entrenado en lenguaje de señas.' },
  { id: 2, nombre: 'Farmacia Central 24h', direccion: 'Jr. Unión 456, Miraflores, Lima', categoria: 'FARMACIA', lat: -12.124, lng: -77.027, telefono: '+51 1 234 5679', desc: 'Entrada accesible nivelada a la vereda, pasillos amplios y dispensación rápida de medicamentos.' },
  { id: 3, nombre: 'Farmacias de Guardia Sur', direccion: 'Av. Larco 789, Miraflores, Lima', categoria: 'FARMACIA', lat: -12.126, lng: -77.030, telefono: '+51 1 234 5680', desc: 'Entrada accesible con rampa mecánica asistida y señalización podotáctil.' }
]

var params = new URLSearchParams(window.location.search)
var serviceId = parseInt(params.get('id')) || 1
var servicio = servicios.find(function(s) { return s.id === serviceId }) || servicios[0]

document.getElementById('service-name').textContent = servicio.nombre
document.getElementById('service-address').textContent = servicio.direccion
document.getElementById('service-category').textContent = servicio.categoria

var map, userMarker, serviceMarker
// Miraflores por defecto
var defaultLat = -12.122
var defaultLng = -77.028

function disabled_aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.body.classList.remove('big-font', 'massive-font')
        if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.body.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++' || config.fontSize === 'A+++') {
          document.body.classList.add('big-font', 'massive-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}
// old config listener disabled

function initMap(lat, lng) {
  // Inicializar mapa Leaflet centrado en el usuario
  map = L.map('map', {
    zoomControl: false
  }).setView([lat, lng], 15)

  // Agregar capa oscura de CartoDB (Dark Matter)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map)

  L.control.zoom({ position: 'topright' }).addTo(map)

  // Marcador de ubicación de usuario
  userMarker = L.circleMarker([lat, lng], {
    radius: 9,
    fillColor: '#00a854',
    color: '#ffffff',
    weight: 3,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map).bindPopup('Tu ubicación actual')

  // Ubicación del servicio
  var serviceLat = servicio.lat || defaultLat
  var serviceLng = servicio.lng || defaultLng

  // Icono verde neón personalizado
  var customIcon = L.divIcon({
    className: 'custom-div-icon',
    html: `<div style="background-color: var(--primary); width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--surface-solid); box-shadow: 0 0 15px var(--primary);"></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  serviceMarker = L.marker([serviceLat, serviceLng], { icon: customIcon }).addTo(map)
    .bindPopup('<b>' + servicio.nombre + '</b><br>' + servicio.desc)

  // Centrar encuadrando ambos marcadores
  var bounds = L.latLngBounds([lat, lng], [serviceLat, serviceLng])
  map.fitBounds(bounds, { padding: [40, 40] })

  // Calcular distancias y tiempos reales en base a geolocalización
  var dist = calculateDistance(lat, lng, serviceLat, serviceLng)
  document.getElementById('distance-display').textContent = Math.round(dist * 1000) + ' m'
  document.getElementById('time-display').textContent = Math.round(dist * 12) + ' min'

  // TTS de bienvenida a los detalles
  window.speechSynthesis.cancel()
  var detailTTS = 'Mostrando detalles de ' + servicio.nombre + ', a una distancia de ' + Math.round(dist * 1000) + ' metros. ' + servicio.desc;
  var utterance = new SpeechSynthesisUtterance(detailTTS);
  utterance.lang = 'es-PE';
  window.speechSynthesis.speak(utterance);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  var R = 6371
  var dLat = (lat2 - lat1) * Math.PI / 180
  var dLon = (lon2 - lon1) * Math.PI / 180
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon/2) * Math.sin(dLon/2)
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
  return R * c
}

function getDirections() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  if (serviceMarker) {
    var latlng = serviceMarker.getLatLng()
    window.speechSynthesis.cancel()
    var msg = new SpeechSynthesisUtterance('Abriendo indicaciones de ruta hacia ' + servicio.nombre)
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
    
    setTimeout(function() {
      window.open('https://www.openstreetmap.org/directions?from=&to=' + latlng.lat + '%2C' + latlng.lng, '_blank')
    }, 1200)
  }
}

function callService() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  window.speechSynthesis.cancel()
  var msg = new SpeechSynthesisUtterance('Llamando a ' + servicio.nombre)
  msg.lang = 'es-PE'
  window.speechSynthesis.speak(msg)
  alert('Llamando al número del local: ' + servicio.telefono + '...')
}

// Geolocalización
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      initMap(pos.coords.latitude, pos.coords.longitude)
    },
    function() {
      // Fallback
      initMap(defaultLat, defaultLng)
    },
    { enableHighAccuracy: true, timeout: 8000 }
  )
} else {
  initMap(defaultLat, defaultLng)
}

window.addEventListener('beforeunload', function() {
  window.speechSynthesis.cancel()
})

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
