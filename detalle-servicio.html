<script>
var servicios = [
  { id: 1, nombre: 'Farmacia Central "San José"', direccion: 'Av. Constitución 124, Planta Baja, Sector 4', categoria: 'FARMACIA', lat: -12.043, lng: -77.038, icon: 'local_pharmacy', telefono: '+51 1 234 5678' },
  { id: 2, nombre: 'Farmacia Central 24h', direccion: 'Jr. Unión 456, Centro', categoria: 'FARMACIA', lat: -12.048, lng: -77.030, icon: 'local_pharmacy', telefono: '+51 1 234 5679' },
  { id: 3, nombre: 'Farmacias de Guardia Sur', direccion: 'Av. Principal 789, Sector Sur', categoria: 'FARMACIA', lat: -12.055, lng: -77.035, icon: 'local_pharmacy', telefono: '+51 1 234 5680' }
]

var params = new URLSearchParams(window.location.search)
var serviceId = parseInt(params.get('id')) || 1
var servicio = servicios.find(function(s) { return s.id === serviceId }) || servicios[0]

document.getElementById('service-name').textContent = servicio.nombre
document.getElementById('service-address').textContent = servicio.direccion
document.getElementById('service-category').textContent = servicio.categoria

var map, userMarker, serviceMarker

function initMap(lat, lng) {
  map = L.map('map', {
    center: [lat, lng],
    zoom: 16,
    zoomControl: true,
    attributionControl: true
  })

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map)

  userMarker = L.circleMarker([lat, lng], {
    radius: 10,
    fillColor: '#75ff9e',
    color: '#003918',
    weight: 3,
    opacity: 1,
    fillOpacity: 0.8
  }).addTo(map).bindPopup('Estás aquí')

  var serviceLat = servicio.lat || lat + (Math.random() - 0.5) * 0.01
  var serviceLng = servicio.lng || lng + (Math.random() - 0.5) * 0.01

  serviceMarker = L.marker([serviceLat, serviceLng], {
    icon: L.divIcon({
      className: '',
      html: '<div style="background:#00e676;width:24px;height:24px;border-radius:50%;border:4px solid #003918;box-shadow:0 0 12px rgba(0,230,118,0.6);"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    })
  }).addTo(map).bindPopup('<b>' + servicio.nombre + '</b><br>' + servicio.direccion)

  var bounds = L.latLngBounds([lat, lng], [serviceLat, serviceLng])
  map.fitBounds(bounds, { padding: [50, 50] })

  var dist = calculateDistance(lat, lng, serviceLat, serviceLng)
  document.getElementById('distance-display').textContent = Math.round(dist * 1000) + ' m'
  document.getElementById('time-display').textContent = Math.round(dist * 12) + ' min'
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  var R = 6371
  var dLat = (lat2 - lat1) * Math.PI / 180
  var dLon = (lon2 - lon1) * Math.PI / 180
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon/2) * Math.sin(dLon/2)
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
  return R * c
}

function getDirections() {
  if (serviceMarker) {
    var latlng = serviceMarker.getLatLng()
    var msg = new SpeechSynthesisUtterance('Abriendo indicaciones hacia ' + servicio.nombre)
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
    window.open('https://www.openstreetmap.org/directions?from=&to=' + latlng.lat + '%2C' + latlng.lng, '_blank')
  }
}

function callService() {
  var msg = new SpeechSynthesisUtterance('Llamando a ' + servicio.nombre)
  msg.lang = 'es-PE'
  window.speechSynthesis.speak(msg)
  alert('Llamando a ' + servicio.nombre + '...')
}

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      initMap(pos.coords.latitude, pos.coords.longitude)
    },
    function() {
      initMap(-12.0464, -77.0428)
    },
    { enableHighAccuracy: true, timeout: 10000 }
  )
} else {
  initMap(-12.0464, -77.0428)
}
</script>
