<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SIMIVOZ - Registro</title>
  <link rel="stylesheet" href="css/variables.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      height: var(--touch-min);
      border-bottom: 2px solid var(--primary);
      background: var(--bg);
    }
    header h1 { color: var(--primary); font-size: 1.5rem; font-weight: 700; text-transform: uppercase; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; max-width: 36rem; margin: 0 auto; width: 100%; }
    .form-group { width: 100%; margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    .form-group input { width: 100%; height: 56px; padding: 0 1rem; border: 2px solid var(--outline); border-radius: 0.5rem; }
    .btn-primary { width: 100%; height: 64px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>SIMIVOZ</h1>
    <a href="index.html" class="btn-icon" aria-label="Volver">X</a>
  </header>
  <main>
    <h1>CREAR CUENTA</h1>
    <form id="registroForm">
      <div class="form-group">
        <label for="full_name">NOMBRE</label>
        <input type="text" id="full_name" required>
      </div>
      <div class="form-group">
        <label for="email">CORREO</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="btn-primary">REGISTRARSE</button>
    </form>
  </main>
  <script>
    document.getElementById('registroForm').onsubmit = (e) => {
        e.preventDefault();
        alert('Registro simulado con éxito.');
        location.href = 'index.html';
    };
  </script>
</body>
</html>
