<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Voz del Asistente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  padding-bottom: 7rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.page-header h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

.page-header p {
  font-size: 0.95rem;
  color: var(--text-secondary);
}

.voice-form {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  width: 100%;
}

.voice-card-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 1.25rem;
  border-radius: 1rem;
  border: 1px solid var(--outline);
  background: var(--surface-container-low);
  cursor: pointer;
  transition: var(--transition-smooth);
}

.voice-card-label:hover {
  background: var(--surface-container-high);
  border-color: var(--primary);
}

.voice-card-wrapper input:checked + .voice-card-label {
  border-color: var(--primary);
  background: rgba(0, 168, 84, 0.05);
  box-shadow: 0 0 12px var(--primary-glow);
}

.voice-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.voice-icon-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface-container-high);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--outline);
  transition: var(--transition-smooth);
}

.voice-card-wrapper input:checked + .voice-card-label .voice-icon-circle {
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

.voice-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.voice-info h3 {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
}

.voice-info p {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 0.15rem;
}

.voice-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.btn-play-sample {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--primary);
  color: var(--primary);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.btn-play-sample:hover {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

.btn-play-sample:active {
  transform: scale(0.9);
}

.check-indicator {
  color: var(--primary);
  opacity: 0;
  transform: scale(0.8);
  transition: var(--transition-smooth);
}

.voice-card-wrapper input:checked + .voice-card-label .check-indicator {
  opacity: 1;
  transform: scale(1);
}

.btn-save-voice {
  width: 100%;
  height: 54px;
  margin-top: 1.5rem;
}

.btn-save-voice.saved {
  background: var(--primary-container);
  box-shadow: 0 0 15px rgba(0, 168, 84, 0.4);
}
</style>
<script src="js/app.js"></script>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header">
  <div class="logo-wrapper">
    <button onclick="volverAtras()" class="btn-icon-header" style="border:none" aria-label="Volver atrás">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size: 1.25rem; margin-left: 0.5rem;">Voz del Asistente</h1>
  </div>
</header>

<main>
  <div class="page-header">
    <h2>Elige la Voz</h2>
    <p>Personaliza el tono y género del sintetizador de voz (TTS) para SIMIVOZ.</p>
  </div>

  <form class="voice-form" id="voiceForm">
    <!-- Female Voice -->
    <div class="voice-card-wrapper">
      <input type="radio" name="voice_selection" id="voice_femenina" value="femenina" checked style="display:none">
      <label class="voice-card-label glass-card" for="voice_femenina">
        <div class="voice-left">
          <div class="voice-icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M12 14v7"/><path d="M9 18h6"/><circle cx="12" cy="12" r="10" stroke="none"/></svg>
          </div>
          <div class="voice-info">
            <h3>Voz Femenina (Clara)</h3>
            <p>Tono agudo y nítido. Óptimo para entornos ruidosos.</p>
          </div>
        </div>
        <div class="voice-actions">
          <button type="button" onclick="reproducirEjemplo('femenina')" class="btn-play-sample" aria-label="Escuchar ejemplo de Voz Femenina Clara">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="check-indicator">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </label>
    </div>

    <!-- Male Voice -->
    <div class="voice-card-wrapper">
      <input type="radio" name="voice_selection" id="voice_masculina" value="masculina" style="display:none">
      <label class="voice-card-label glass-card" for="voice_masculina">
        <div class="voice-left">
          <div class="voice-icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M12 14v7"/><circle cx="12" cy="12" r="10" stroke="none"/></svg>
          </div>
          <div class="voice-info">
            <h3>Voz Masculina (Grave)</h3>
            <p>Tono profundo y pausado. Muy relajante para la lectura.</p>
          </div>
        </div>
        <div class="voice-actions">
          <button type="button" onclick="reproducirEjemplo('masculina')" class="btn-play-sample" aria-label="Escuchar ejemplo de Voz Masculina Grave">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="check-indicator">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </label>
    </div>

    <!-- Neutral Voice -->
    <div class="voice-card-wrapper">
      <input type="radio" name="voice_selection" id="voice_neutra" value="neutra" style="display:none">
      <label class="voice-card-label glass-card" for="voice_neutra">
        <div class="voice-left">
          <div class="voice-icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><circle cx="12" cy="12" r="10" stroke="none"/></svg>
          </div>
          <div class="voice-info">
            <h3>Voz Neutra</h3>
            <p>Sintética, de ritmo constante. Altamente inteligible.</p>
          </div>
        </div>
        <div class="voice-actions">
          <button type="button" onclick="reproducirEjemplo('neutra')" class="btn-play-sample" aria-label="Escuchar ejemplo de Voz Neutra">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="check-indicator">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </label>
    </div>

    <!-- Submit btn -->
    <button type="submit" class="btn-primary-action btn-save-voice" aria-label="Guardar configuración de voz del asistente">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>GUARDAR SELECCIÓN</span>
    </button>
  </form>
</main>

<nav class="unified-nav" aria-label="Navegación principal">
  <div class="unified-nav-inner">
    <a href="inicio.html" class="unified-nav-item" aria-label="Página de inicio">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="voz.html" class="unified-nav-item" aria-label="Asistente de voz">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span>Voz</span>
    </a>
    <a href="lectura.html" class="unified-nav-item" aria-label="Lector de textos">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Lectura</span>
    </a>
    <a href="servicios.html" class="unified-nav-item" aria-label="Mapa de servicios">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Mapa</span>
    </a>
    <a href="configuracion.html" class="unified-nav-item active" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ajustes</span>
    </a>
  </div>
</nav>

<div class="nav-spacer"></div>

<script>
function disabled_aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.body.classList.remove('big-font', 'massive-font')
        if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.body.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++' || config.fontSize === 'A+++') {
          document.body.classList.add('big-font', 'massive-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
  
  if (localStorage.getItem('simivoz_tutorial_completado') !== 'true') {
    document.body.classList.add('onboarding-active');
  }
}
// old config listener disabled

function volverAtras() {
  if (localStorage.getItem('simivoz_tutorial_completado') !== 'true') {
    location.href = 'lector-inteligente.html';
  } else {
    location.href = 'configuracion.html';
  }
}

function reproducirEjemplo(tipo) {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  
  var textos = {
    femenina: 'Esta es la voz femenina clara, ideal para lectura de textos largos.',
    masculina: 'Esta es la voz masculina grave, relajante y pausada para escuchar.',
    neutra: 'Esta es la voz neutra, sintética y de ritmo constante.'
  }
  
  window.speechSynthesis.cancel()
  var msg = new SpeechSynthesisUtterance(textos[tipo] || 'Ejemplo de voz')
  msg.lang = 'es-PE'
  if (tipo === 'masculina') {
    msg.pitch = 0.75
    msg.rate = 0.95
  } else if (tipo === 'femenina') {
    msg.pitch = 1.35
    msg.rate = 1.05
  } else {
    msg.pitch = 1.0
    msg.rate = 1.0
  }
  window.speechSynthesis.speak(msg)
}

document.getElementById('voiceForm').addEventListener('submit', function(e) {
  e.preventDefault()
  if (window.navigator.vibrate) window.navigator.vibrate(50)

  var seleccion = document.querySelector('input[name="voice_selection"]:checked')
  if (seleccion) {
    localStorage.setItem('simivoz_voice', seleccion.value)
    
    var btn = this.querySelector('button[type="submit"]')
    btn.querySelector('span').textContent = 'CONFIGURACIÓN GUARDADA'
    btn.classList.add('saved')

    window.speechSynthesis.cancel()
    var msg = new SpeechSynthesisUtterance('Voz guardada correctamente')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)

    const tutorialCompletado = localStorage.getItem('simivoz_tutorial_completado')
    if (tutorialCompletado !== 'true') {
      localStorage.setItem('simivoz_tutorial_completado', 'true')
      setTimeout(function() {
        window.speechSynthesis.cancel()
        var welcomeMsg = new SpeechSynthesisUtterance('Tutorial completado. Bienvenido a SimiVoz.')
        welcomeMsg.lang = 'es-PE'
        window.speechSynthesis.speak(welcomeMsg)
        location.href = 'inicio.html'
      }, 1500)
    } else {
      setTimeout(function() {
        btn.querySelector('span').textContent = 'GUARDAR SELECCIÓN'
        btn.classList.remove('saved')
      }, 2000)
    }
  }
})

// Cargar la voz guardada inicialmente
var savedVoice = localStorage.getItem('simivoz_voice')
if (savedVoice) {
  var radio = document.getElementById('voice_' + savedVoice)
  if (radio) radio.checked = true
}

document.querySelectorAll('.voice-card-label, .btn-play-sample, button').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
