<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Elegir Voz del Asistente</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

        "primary-container": "#00e676",
        "primary-fixed": "#62ff96",
        "primary-fixed-dim": "#00e475",
        "on-primary": "#003918",
        "on-primary-container": "#00612e",
        "on-primary-fixed": "#00210b",
        "on-primary-fixed-variant": "#005226",
        "surface": "#121414",
        "surface-container": "#1e2020",
        "surface-container-high": "#282a2b",
        "surface-container-low": "#1a1c1c",
        "surface-container-lowest": "#0c0f0f",
        "surface-container-highest": "#333535",
        "surface-variant": "#333535",
        "surface-bright": "#38393a",
        "surface-dim": "#121414",
        "on-surface": "#e2e2e2",
        "on-surface-variant": "#bacbb9",
        "outline": "#859585",
        "outline-variant": "#3b4a3d",
        "secondary": "#b3ceab",
        "secondary-container": "#354d32",
        "on-secondary": "#1f361d",
        "on-secondary-container": "#a2bc9a",
        "on-secondary-fixed": "#0a2009",
        "on-secondary-fixed-variant": "#354d32",
        "secondary-fixed": "#cfeac6",
        "secondary-fixed-dim": "#b3ceab",
        "background": "#121414",
        "on-background": "#e2e2e2",
        "tertiary": "#e7e4e3",
        "tertiary-container": "#cac8c7",
        "error": "#ffb4ab",
        "error-container": "#93000a",

        "on-error-container": "#ffdad6",
        "inverse-surface": "#e2e2e2",
        "inverse-on-surface": "#2f3131",
        "inverse-primary": "#006d35",
        "surface-tint": "#00e475"
      },
      borderRadius: {
        DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem"
      },
      spacing: {
        "touch-target-min": "44px", "xs": "0.5rem", "sm": "1rem", "md": "1.5rem", "lg": "2.5rem", "xl": "4rem",

        "body-md": ["Inter"], "interactive-text": ["Inter"], "headline-lg-mobile": ["Inter"], "body-lg": ["Inter"]
      },
      fontSize: {
        "headline-md": ["1.5rem", { "lineHeight": "1.3", "fontWeight": "600" }],
        "headline-lg": ["2.25rem", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-lg": ["0.875rem", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
        "body-md": ["1rem", { "lineHeight": "1.5", "fontWeight": "400" }],

<style>
body.modo-simplificado .simplified-hide { display: none !important; }
body.modo-simplificado .simplified-full-btn { height: 88px !important; font-size: 1.25rem !important; }

*:focus-visible {
  outline: 3px solid #75ff9e !important;
  outline-offset: 2px !important;
}
.radio-card:has(input:checked) {
  border-color: #00e676;
  background-color: #354d32;
}
.radio-card:has(input:checked) .check-icon {
  opacity: 1;
}
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">

<header class="w-full top-0 sticky z-40 bg-background border-b-2 border-outline-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-touch-target-min">
  <button onclick="history.back()" class="text-primary hover:bg-secondary-container transition-transform active:scale-95 flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full" aria-label="Volver">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <h1 class="font-headline-md text-headline-md font-bold text-primary">SIMIVOZ</h1>
  <a href="configuracion.html" class="text-primary hover:bg-secondary-container transition-transform active:scale-95 flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full" aria-label="Ajustes">
    <span class="material-symbols-outlined">settings</span>
  </a>
</header>

<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-lg max-w-4xl mx-auto w-full">
  <div class="mb-lg">
    <h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Elegir Voz del Asistente</h2>
    <p class="font-body-lg text-body-lg text-on-surface-variant">Seleccione la voz que prefiera para la lectura y las notificaciones.</p>
  </div>

  <form class="flex-grow flex flex-col gap-md" id="voiceForm">
    <div class="relative w-full radio-card">
      <input class="sr-only" type="radio" name="voice_selection" id="voice_1" value="femenina" checked>
      <label class="flex items-center justify-between bg-surface border-2 border-outline-variant rounded-xl p-md cursor-pointer transition-all hover:bg-surface-container-high" for="voice_1">
        <div class="flex items-center gap-md">
          <div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">face_3</span>
          </div>
          <div>
            <h3 class="font-interactive-text text-interactive-text text-on-surface mb-1">Voz Femenina (Clara)</h3>
            <p class="font-body-md text-body-md text-on-surface-variant">Tono agudo, ideal para entornos ruidosos.</p>
          </div>
        </div>
        <div class="flex items-center gap-sm">
          <button type="button" onclick="reproducirEjemplo('femenina')" class="w-touch-target-min h-touch-target-min rounded-full border-2 border-primary text-primary flex items-center justify-center hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all" aria-label="Reproducir ejemplo Voz Femenina">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
          </button>
          <div class="check-icon opacity-0 text-primary transition-opacity duration-200">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          </div>
        </div>
      </label>
    </div>

    <div class="relative w-full radio-card">
      <input class="sr-only" type="radio" name="voice_selection" id="voice_2" value="masculina">
      <label class="flex items-center justify-between bg-surface border-2 border-outline-variant rounded-xl p-md cursor-pointer transition-all hover:bg-surface-container-high" for="voice_2">
        <div class="flex items-center gap-md">
          <div class="w-12 h-12 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">face_6</span>
          </div>
          <div>
            <h3 class="font-interactive-text text-interactive-text text-on-surface mb-1">Voz Masculina (Grave)</h3>
            <p class="font-body-md text-body-md text-on-surface-variant">Tono profundo, relajante y pausado.</p>
          </div>
        </div>
        <div class="flex items-center gap-sm">
          <button type="button" onclick="reproducirEjemplo('masculina')" class="w-touch-target-min h-touch-target-min rounded-full border-2 border-primary text-primary flex items-center justify-center hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all" aria-label="Reproducir ejemplo Voz Masculina">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
          </button>
          <div class="check-icon opacity-0 text-primary transition-opacity duration-200">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          </div>
        </div>
      </label>
    </div>

    <div class="relative w-full radio-card">
      <input class="sr-only" type="radio" name="voice_selection" id="voice_3" value="neutra">
      <label class="flex items-center justify-between bg-surface border-2 border-outline-variant rounded-xl p-md cursor-pointer transition-all hover:bg-surface-container-high" for="voice_3">
        <div class="flex items-center gap-md">
          <div class="w-12 h-12 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
          </div>
          <div>
            <h3 class="font-interactive-text text-interactive-text text-on-surface mb-1">Voz Neutra</h3>
            <p class="font-body-md text-body-md text-on-surface-variant">Sintética y altamente inteligible.</p>
          </div>
        </div>
        <div class="flex items-center gap-sm">
          <button type="button" onclick="reproducirEjemplo('neutra')" class="w-touch-target-min h-touch-target-min rounded-full border-2 border-primary text-primary flex items-center justify-center hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all" aria-label="Reproducir ejemplo Voz Neutra">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
          </button>
          <div class="check-icon opacity-0 text-primary transition-opacity duration-200">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          </div>
        </div>
      </label>
    </div>

    <div class="mt-auto pt-xl">
      <button type="submit" class="w-full bg-primary-container text-on-primary font-interactive-text text-interactive-text uppercase tracking-widest py-md rounded-xl min-h-[64px] hover:bg-primary active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
        Guardar Selección
      </button>
    </div>
  </form>
</main>

<script>
function reproducirEjemplo(tipo) {
  var textos = {
    femenina: 'Esta es la voz femenina clara, ideal para lectura de textos largos.',
    masculina: 'Esta es la voz masculina grave, relajante y pausada para escuchar.',
    neutra: 'Esta es la voz neutra, sintética y altamente inteligible.'
  }
  var msg = new SpeechSynthesisUtterance(textos[tipo] || 'Ejemplo de voz')
  msg.lang = 'es-PE'
  if (tipo === 'masculina') {
    msg.pitch = 0.7
    msg.rate = 0.9
  } else if (tipo === 'femenina') {
    msg.pitch = 1.4
    msg.rate = 1.1
  } else {
    msg.pitch = 1.0
    msg.rate = 1.0
  }
  speechSynthesis.speak(msg)
}

document.getElementById('voiceForm').addEventListener('submit', function(e) {
  e.preventDefault()
  var seleccion = document.querySelector('input[name="voice_selection"]:checked')
  if (seleccion) {
    localStorage.setItem('simivoz_voice', seleccion.value)
    var btn = this.querySelector('button[type="submit"]')
    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> GUARDADO'
    btn.classList.remove('bg-primary-container', 'hover:bg-primary')
    btn.classList.add('bg-primary-fixed')
    setTimeout(function() {
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">save</span> Guardar Selección'
      btn.classList.remove('bg-primary-fixed')
      btn.classList.add('bg-primary-container', 'hover:bg-primary')
    }, 2000)
  }
})

var savedVoice = localStorage.getItem('simivoz_voice')
if (savedVoice) {
  var radio = document.getElementById('voice_' + {fem: 1, femenina: 1, mas: 2, masculina: 2, neut: 3, neutra: 3}[savedVoice] || '1')
  if (radio) radio.checked = true
}
</script>
</body>
</html>
