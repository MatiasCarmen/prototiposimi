<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --deep-forest: #051A05;
  --surface: #121414;
  --surface-container: #1e2020;
  --surface-container-low: #1a1c1c;
  --surface-container-lowest: #0c0f0f;
  --primary: #75ff9e;
  --primary-container: #00e676;
  --on-primary: #003918;
  --text: #e2e2e2;
  --text-secondary: #bacbb9;
  --outline-variant: #3b4a3d;
  --surface-variant: #333535;
  --touch-min: 44px;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--surface);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

*:focus-visible {
  outline: 3px solid var(--primary) !important;
  outline-offset: 3px !important;
}

header {
  width: 100%;
  position: sticky;
  top: 0;
  background: var(--surface);
  border-bottom: 2px solid var(--outline-variant);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 1rem;
  height: var(--touch-min);
  z-index: 50;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  height: 100%;
  padding: 0.25rem 0;
}

.header-left img {
  height: 100%;
  width: auto;
}

.header-left h1 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--primary);
}

.btn-icon {
  width: var(--touch-min);
  height: var(--touch-min);
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--primary);
  border-radius: 0.5rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.btn-icon:hover {
  background: var(--surface-container);
}

.btn-icon:active {
  transform: scale(0.95);
}

main {
  flex: 1;
  width: 100%;
  max-width: 42rem;
  margin: 0 auto;
  padding: 1.5rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.btn-massive {
  width: 100%;
  height: clamp(80px, 15vh, 140px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  border: none;
  border-radius: 0.5rem;
  font-family: 'Inter', sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  text-transform: uppercase;
  background: var(--primary);
  color: var(--on-primary);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn-massive:hover {
  box-shadow: 0 0 0 4px var(--primary);
  transform: scale(1.02);
}

.btn-massive:active {
  transform: scale(0.97);
}

.btn-massive .icon {
  flex-shrink: 0;
  transition: transform 0.2s;
}

.btn-massive:hover .icon {
  transform: scale(1.1);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  z-index: 50;
  background: var(--surface-container-lowest);
  border-top: 2px solid var(--outline-variant);
}

.bottom-nav-inner {
  display: flex;
  justify-content: space-around;
  align-items: center;
  width: 100%;
  padding: 0.25rem 0.5rem;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: var(--touch-min);
  width: 20%;
  padding: 0.25rem;
  border-radius: 9999px;
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  transition: background 0.2s;
}

.nav-item:hover {
  background: var(--surface-variant);
}

.nav-item:active {
  transform: scale(0.9);
}

.nav-item.active {
  background: var(--primary);
  color: var(--on-primary);
}

.nav-item svg {
  margin-bottom: 0.125rem;
}

.nav-spacer {
  height: 5rem;
  width: 100%;
}

body.modo-simplificado .simplified-hide {
  display: none !important;
}

body.modo-simplificado .simplified-full-btn {
  height: 88px !important;
  font-size: 1.25rem !important;
}

.hidden {
  display: none !important;
}

.btn-cancel {
  padding: 0 2.5rem;
  height: var(--touch-min);
  border: 2px solid #ffb4ab;
  background: none;
  color: #ffb4ab;
  border-radius: 0.5rem;
  font-family: 'Inter', sans-serif;
  font-size: 1.125rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

.btn-cancel:hover {
  background: rgba(255, 180, 171, 0.1);
}

.btn-cancel:active {
  background: #ffb4ab;
  color: #690005;
}

@keyframes ping {
  75%, 100% { transform: scale(2); opacity: 0; }
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.6; }
}
</style>
