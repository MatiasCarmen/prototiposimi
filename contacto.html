<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Contacto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<script src="js/app.js"></script>
<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  padding-bottom: 7rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.page-header h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

.page-header p {
  font-size: 0.95rem;
  color: var(--text-secondary);
}

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  padding: 1.5rem;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.form-group input, .form-group textarea {
  width: 100%;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  border-radius: 0.85rem;
  padding: 1rem;
  color: var(--text);
  font-family: var(--font-base);
  font-size: 1rem;
  transition: var(--transition-smooth);
}

.form-group input:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
  background: var(--surface-container-high);
}

.form-group textarea {
  resize: vertical;
  min-height: 120px;
}

.btn-submit {
  height: 54px;
  margin-top: 0.5rem;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--surface-border);
}

.info-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--text);
}

.info-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0, 168, 84, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}
</style>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header">
  <div class="logo-wrapper">
    <button onclick="history.back()" class="btn-icon-header" style="border:none" aria-label="Volver atrás">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size: 1.25rem; margin-left: 0.5rem;">Contacto</h1>
  </div>
</header>

<main>
  <div class="page-header">
    <h2>Escríbenos</h2>
    <p>Estamos aquí para ayudarte. Déjanos tu mensaje y te responderemos pronto.</p>
  </div>

  <div class="glass-card contact-form">
    <form id="contactForm">
      <div class="form-group">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" placeholder="Ej: Problema con la voz" required>
      </div>
      
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" placeholder="Describe cómo podemos ayudarte..." required></textarea>
      </div>
      
      <button type="submit" class="btn-primary-action btn-submit" aria-label="Enviar mensaje">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span>ENVIAR MENSAJE</span>
      </button>
    </form>
    
    <div class="contact-info">
      <div class="info-item">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div>
          <strong>Soporte</strong><br>
          <span style="font-size:0.9rem; color:var(--text-secondary)">soporte@simivoz.com</span>
        </div>
      </div>
      <div class="info-item">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div>
          <strong>Teléfono</strong><br>
          <span style="font-size:0.9rem; color:var(--text-secondary)">+51 800 123 456</span>
        </div>
      </div>
    </div>
  </div>
</main>

<nav class="unified-nav" aria-label="Navegación principal">
  <div class="unified-nav-inner">
    <a href="inicio.html" class="unified-nav-item" aria-label="Página de inicio">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="voz.html" class="unified-nav-item" aria-label="Asistente de voz">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span>Voz</span>
    </a>
    <a href="lectura.html" class="unified-nav-item" aria-label="Lector de textos">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Lectura</span>
    </a>
    <a href="servicios.html" class="unified-nav-item" aria-label="Mapa de servicios">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Mapa</span>
    </a>
    <a href="configuracion.html" class="unified-nav-item" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ajustes</span>
    </a>
  </div>
</nav>
<div class="nav-spacer"></div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (window.navigator.vibrate) window.navigator.vibrate(50);
  
  var btn = this.querySelector('button');
  btn.querySelector('span').textContent = 'ENVIANDO...';
  
  setTimeout(function() {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance('Mensaje enviado correctamente. Te contactaremos pronto.');
    msg.lang = 'es-PE';
    window.speechSynthesis.speak(msg);
    
    alert('Mensaje simulado enviado con éxito.');
    history.back();
  }, 1000);
});

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50);
  });
});
</script>
</body>
</html>
