<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  max-width: 440px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  z-index: 10;
}

.logo-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 2rem;
  text-align: center;
}

.logo-section img {
  width: 90px;
  height: auto;
  margin-bottom: 1rem;
  filter: drop-shadow(0 0 15px var(--primary-glow));
  animation: float 4s ease-in-out infinite;
}

.welcome {
  font-size: 2.25rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.1;
  letter-spacing: -0.03em;
}

.tagline {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 0.5rem;
}

.form-container {
  width: 100%;
  padding: 2rem;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  color: var(--text-secondary);
}

.input-wrapper {
  position: relative;
}

.input-wrapper input {
  width: 100%;
  height: 52px;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  color: var(--text);
  padding: 0 1.25rem;
  font-family: var(--font-base);
  font-size: 1rem;
  border-radius: 0.75rem;
  transition: var(--transition-smooth);
}

.input-wrapper input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
  background: var(--surface-container-high);
}

.input-wrapper input::placeholder {
  color: var(--text-secondary);
  opacity: 0.5;
}

.btn-login {
  width: 100%;
  height: 54px;
  margin-top: 1.5rem;
}

.helper-links {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 1.25rem;
  gap: 0.75rem;
  width: 100%;
}

.helper-link {
  background: none;
  border: none;
  font-family: var(--font-base);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--primary);
  cursor: pointer;
  text-decoration: none;
  transition: var(--transition-smooth);
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.helper-link:hover {
  color: var(--text);
  text-shadow: 0 0 8px var(--primary-glow);
}

.voice-toggle-card {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1rem;
  width: 100%;
  border: 1px dashed var(--primary);
  border-radius: 1rem;
  background: rgba(0, 168, 84, 0.03);
  cursor: pointer;
  margin-top: 1.5rem;
  transition: var(--transition-smooth);
  text-align: left;
}

.voice-toggle-card:hover {
  background: rgba(0, 168, 84, 0.08);
  border-style: solid;
  box-shadow: 0 0 15px var(--primary-glow);
}

.voice-icon-wrapper {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px var(--primary-glow);
}

.voice-text .main-text {
  font-size: 1rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 0.05em;
}

.voice-text .sub-text {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 1px;
}

/* Voice modal styles */
.voice-feedback {
  position: fixed;
  inset: 0;
  background: rgba(240, 250, 244, 0.97);
  backdrop-filter: blur(10px);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 1;
  transition: var(--transition-smooth);
}

.voice-feedback.hidden {
  opacity: 0;
  pointer-events: none;
}

.pulse-ring-container {
  width: 180px;
  height: 180px;
  position: relative;
  margin-bottom: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pulse-ring-container .ring-outer {
  position: absolute;
  width: 100%;
  height: 100%;
  background: var(--primary-glow);
  border: 1px solid var(--primary);
  border-radius: 50%;
  animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}

.pulse-ring-container .ring-middle {
  position: absolute;
  width: 80%;
  height: 80%;
  background: var(--primary-glow);
  border: 2px solid var(--primary);
  border-radius: 50%;
  animation: ping-delayed 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}

.pulse-ring-container .ring-inner {
  position: absolute;
  width: 55%;
  height: 55%;
  background: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px var(--primary);
  z-index: 10;
}

.pulse-ring-container .ring-inner svg {
  color: var(--on-primary);
  animation: pulse-icon 1.5s ease-in-out infinite;
}

.voice-feedback h2 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary);
  text-align: center;
  margin-bottom: 0.75rem;
  letter-spacing: -0.02em;
}

.voice-feedback > p {
  font-size: 1rem;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 3rem;
  max-width: 320px;
  line-height: 1.4;
}

.btn-cancel {
  padding: 0.75rem 2.5rem;
  height: var(--touch-min);
  border: 2px solid var(--error);
  background: var(--error-bg);
  color: var(--error);
  border-radius: 99px;
  font-family: var(--font-base);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.btn-cancel:hover {
  background: var(--error);
  color: var(--on-error);
  box-shadow: 0 0 15px rgba(255, 180, 171, 0.4);
}

.btn-cancel:active {
  transform: scale(0.95);
}

@keyframes ping {
  0% { transform: scale(0.7); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

@keyframes ping-delayed {
  0% { transform: scale(0.7); opacity: 0; }
  30% { transform: scale(0.7); opacity: 1; }
  100% { transform: scale(1.2); opacity: 0; }
}

@keyframes pulse-icon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.6;
}
</style>
<script src="js/app.js"></script>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header" style="justify-content: flex-end; padding-top: 1rem; padding-right: 1.5rem; background: transparent; border: none; box-shadow: none;">
  <button class="btn-icon-header" onclick="location.href='configuracion.html'" aria-label="Abrir ajustes de accesibilidad">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="logo-section">
    <img src="assets/img/logoSimi.png" alt="Logotipo SIMIVOZ">
    <h2 class="welcome">Hola</h2>
    <p class="tagline">Ecosistema de Accesibilidad</p>
  </div>

  <div class="form-container glass-card">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="login-email" name="email" placeholder="ejemplo@correo.com" aria-label="Correo electrónico" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" name="password" placeholder="••••••••" aria-label="Contraseña" required>
        </div>
      </div>
      
      <button type="submit" class="btn-primary-action btn-login" aria-label="Iniciar sesión con tus credenciales">
        <span>ENTRAR</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      
      <div class="helper-links">
        <button type="button" class="helper-link" aria-label="Recuperar contraseña perdida">¿OLVIDASTE TU CONTRASEÑA?</button>
        <a href="registrarse.html" class="helper-link" style="color:var(--text); gap:0.5rem;" aria-label="Crear una nueva cuenta de SIMIVOZ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          CREAR CUENTA
        </a>
      </div>
    </form>

    <button class="voice-toggle-card" onclick="toggleVoice()" aria-label="Iniciar sesión usando comandos de voz de SIMIVOZ">
      <div class="voice-icon-wrapper">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </div>
      <div class="voice-text">
        <p class="main-text">INICIAR CON VOZ</p>
        <p class="sub-text">Di "Iniciar" o "Registrar"</p>
      </div>
    </button>
  </div>
</main>

<div id="voice-feedback" class="hidden voice-feedback" aria-live="polite" role="dialog" aria-modal="true" aria-labelledby="voice-feedback-title">
  <div class="pulse-ring-container">
    <div class="ring-outer"></div>
    <div class="ring-middle"></div>
    <div class="ring-inner">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </div>
  </div>
  <h2 id="voice-feedback-title">Escuchando...</h2>
  <p id="voice-feedback-desc">Di "Iniciar" para entrar, "Registrar" para crear cuenta o "Cancelar" para salir.</p>
  <button class="btn-cancel" onclick="toggleVoice()" aria-label="Cancelar comando de voz y cerrar diálogo">CANCELAR</button>
</div>

<footer>
  <p>© 2026 SIMIVOZ - Ecosistema de Accesibilidad Contextual</p>
</footer>

<script>
var isListening = false
var recognition = null

function disabled_aplicarConfiguracion() {
  try {
    const logeado = localStorage.getItem('simivoz_usuario_logeado')
    const tutorial = localStorage.getItem('simivoz_tutorial_completado')
    if (logeado === 'true') {
      if (tutorial === 'true') {
        location.href = 'inicio.html'
        return
      } else {
        location.href = 'bienvenido.html'
        return
      }
    }

    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) {
        document.body.classList.add('high-contrast')
      } else {
        document.body.classList.remove('high-contrast')
      }
      
      if (config.simplified) {
        document.body.classList.add('modo-simplificado')
      } else {
        document.body.classList.remove('modo-simplificado')
      }
      
      if (config.fontSize) {
        // Quitar previas
        document.body.classList.remove('big-font', 'massive-font')
        if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.body.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++' || config.fontSize === 'A+++') {
          document.body.classList.add('big-font', 'massive-font')
        }
      }
    }
  } catch (err) {
    console.error('Error al aplicar configuración inicial:', err)
  }
}

// old config listener disabled

function handleLogin(e) {
  e.preventDefault()
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  localStorage.setItem('simivoz_usuario_logeado', 'true')
  
  const tutorial = localStorage.getItem('simivoz_tutorial_completado')
  if (tutorial === 'true') {
    location.href = 'inicio.html'
  } else {
    location.href = 'bienvenido.html'
  }
}

function toggleVoice() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  const feedback = document.getElementById('voice-feedback')
  const isHidden = feedback.classList.toggle('hidden')
  isListening = !isHidden

  if (isListening) {
    iniciarSpeechRecognition()
  } else {
    detenerSpeechRecognition()
  }
}

function iniciarSpeechRecognition() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    document.getElementById('voice-feedback-title').textContent = 'No compatible'
    document.getElementById('voice-feedback-desc').textContent = 'Tu navegador no soporta control por voz.'
    return
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  recognition = new SpeechRecognition()
  recognition.lang = 'es-PE'
  recognition.continuous = true
  recognition.interimResults = false

  recognition.onstart = function() {
    var msg = new SpeechSynthesisUtterance('Escuchando comandos de inicio de sesión')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
  }

  recognition.onresult = function(event) {
    var resultText = event.results[event.results.length - 1][0].transcript.toLowerCase().trim()
    console.log('Comando captado:', resultText)
    
    if (resultText.includes('iniciar') || resultText.includes('entrar') || resultText.includes('ingresar') || resultText.includes('entrate')) {
      var msg = new SpeechSynthesisUtterance('Iniciando sesión')
      msg.lang = 'es-PE'
      window.speechSynthesis.speak(msg)
      setTimeout(function() {
        localStorage.setItem('simivoz_usuario_logeado', 'true')
        const tutorial = localStorage.getItem('simivoz_tutorial_completado')
        if (tutorial === 'true') {
          location.href = 'inicio.html'
        } else {
          location.href = 'bienvenido.html'
        }
      }, 1000)
    } else if (resultText.includes('registrar') || resultText.includes('crear cuenta') || resultText.includes('cuenta')) {
      var msg = new SpeechSynthesisUtterance('Redirigiendo a registro')
      msg.lang = 'es-PE'
      window.speechSynthesis.speak(msg)
      setTimeout(function() { location.href = 'registrarse.html' }, 1000)
    } else if (resultText.includes('cancelar') || resultText.includes('salir') || resultText.includes('volver')) {
      toggleVoice()
    }
  }

  recognition.onerror = function(e) {
    console.error('Error de voz:', e)
  }

  recognition.start()
}

function detenerSpeechRecognition() {
  if (recognition) {
    recognition.stop()
    recognition = null
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const feedback = document.getElementById('voice-feedback')
    if (!feedback.classList.contains('hidden')) toggleVoice()
  }
})

document.querySelectorAll('button, a, .voice-toggle-card').forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
