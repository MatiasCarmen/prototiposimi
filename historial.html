<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Historial - SIMIVOZ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#75ff9e", "primary-container": "#00e676", "primary-fixed": "#62ff96", "primary-fixed-dim": "#00e475",
        "on-primary": "#003918", "on-primary-container": "#00612e", "on-primary-fixed": "#00210b", "on-primary-fixed-variant": "#005226",
        "surface": "#121414", "surface-container": "#1e2020", "surface-container-high": "#282a2b",
        "surface-container-low": "#1a1c1c", "surface-container-lowest": "#0c0f0f", "surface-container-highest": "#333535",
        "surface-variant": "#333535", "on-surface": "#e2e2e2", "on-surface-variant": "#bacbb9",
        "outline": "#859585", "outline-variant": "#3b4a3d",
        "secondary": "#b3ceab", "secondary-container": "#354d32",
        "on-secondary": "#1f361d", "on-secondary-container": "#a2bc9a",
        "background": "#121414", "on-background": "#e2e2e2",
        "tertiary": "#e7e4e3", "tertiary-container": "#cac8c7",
        "error": "#ffb4ab", "error-container": "#93000a", "on-error": "#690005", "on-error-container": "#ffdad6",
        "inverse-surface": "#e2e2e2", "inverse-on-surface": "#2f3131", "inverse-primary": "#006d35", "surface-tint": "#00e475"
      },
      borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      spacing: {
        "touch-target-min": "44px", "xs": "0.5rem", "sm": "1rem", "md": "1.5rem", "lg": "2.5rem", "xl": "4rem",
        "margin-mobile": "1rem", "margin-desktop": "3rem", "gutter": "1.5rem", "base": "4px"
      },
      fontFamily: {
        "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"],
        "body-md": ["Inter"], "interactive-text": ["Inter"], "headline-lg-mobile": ["Inter"], "body-lg": ["Inter"]
      },
      fontSize: {
        "headline-md": ["1.5rem", { "lineHeight": "1.3", "fontWeight": "600" }],
        "headline-lg": ["2.25rem", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-lg": ["0.875rem", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
        "body-md": ["1rem", { "lineHeight": "1.5", "fontWeight": "400" }],
        "interactive-text": ["1.125rem", { "lineHeight": "1", "fontWeight": "700" }],
        "headline-lg-mobile": ["1.75rem", { "lineHeight": "1.2", "fontWeight": "700" }],
        "body-lg": ["1.125rem", { "lineHeight": "1.6", "fontWeight": "400" }]
      }
    }
  }
}
</script>
<style>
body.modo-simplificado .simplified-hide { display: none !important; }
body.modo-simplificado .simplified-full-btn { height: 88px !important; font-size: 1.25rem !important; }

*:focus-visible { outline: 3px solid #75ff9e !important; outline-offset: 2px !important; }
</style>
</head>
<body class="antialiased flex flex-col min-h-screen bg-background text-on-background">

<header class="fixed top-0 w-full z-50 flex justify-between items-center h-16 px-margin-mobile bg-background border-b-2 border-outline-variant">
  <button onclick="location.href='inicio.html'" class="text-primary hover:bg-secondary-container active:scale-95 transition-transform w-touch-target-min h-touch-target-min flex items-center justify-center rounded" aria-label="Menú principal">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
  </button>
  <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">HISTORIAL</h1>
  <a href="configuracion.html" class="text-primary hover:bg-secondary-container active:scale-95 transition-transform w-touch-target-min h-touch-target-min flex items-center justify-center rounded" aria-label="Ajustes">
    <span class="material-symbols-outlined">settings</span>
  </a>
</header>

<main class="flex-1 mt-16 mb-20 p-margin-mobile md:p-margin-desktop w-full max-w-4xl mx-auto flex flex-col gap-sm">
  <div class="mb-sm">
    <h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">Actividad Reciente</h2>
    <p class="font-body-md text-body-md text-on-surface-variant">Revisa tus últimas acciones y comandos procesados por SIMIVOZ.</p>
  </div>

  <div class="flex flex-col gap-sm">
    <button onclick="location.href='lectura.html'" class="w-full bg-surface border border-outline-variant rounded-lg p-md flex items-center gap-md touch-target focus-ring hover:bg-surface-container-highest active:bg-secondary-container transition-colors text-left group">
      <div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
        <span class="material-symbols-outlined text-3xl">menu_book</span>
      </div>
      <div class="flex-1 flex flex-col">
        <span class="font-interactive-text text-interactive-text text-on-surface mb-1">Documento leído</span>
        <span class="font-body-md text-body-md text-on-surface-variant">Especificaciones Técnicas</span>
      </div>
      <div class="flex-shrink-0 text-on-surface-variant text-sm whitespace-nowrap">Hace 10 min</div>
    </button>

    <button onclick="location.href='voz.html'" class="w-full bg-surface border border-outline-variant rounded-lg p-md flex items-center gap-md touch-target focus-ring hover:bg-surface-container-highest active:bg-secondary-container transition-colors text-left group">
      <div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
        <span class="material-symbols-outlined text-3xl">mic</span>
      </div>
      <div class="flex-1 flex flex-col">
        <span class="font-interactive-text text-interactive-text text-on-surface mb-1">Comando de voz</span>
        <span class="font-body-md text-body-md text-on-surface-variant">Buscar Farmacia Cercana</span>
      </div>
      <div class="flex-shrink-0 text-on-surface-variant text-sm whitespace-nowrap">Hace 2 horas</div>
    </button>

    <button onclick="location.href='configuracion.html'" class="w-full bg-surface border border-outline-variant rounded-lg p-md flex items-center gap-md touch-target focus-ring hover:bg-surface-container-highest active:bg-secondary-container transition-colors text-left group">
      <div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
        <span class="material-symbols-outlined text-3xl">settings</span>
      </div>
      <div class="flex-1 flex flex-col">
        <span class="font-interactive-text text-interactive-text text-on-surface mb-1">Ajuste cambiado</span>
        <span class="font-body-md text-body-md text-on-surface-variant">Activado Alto Contraste</span>
      </div>
      <div class="flex-shrink-0 text-on-surface-variant text-sm whitespace-nowrap">Ayer</div>
    </button>

    <button onclick="location.href='servicios.html'" class="w-full bg-surface border border-outline-variant rounded-lg p-md flex items-center gap-md touch-target focus-ring hover:bg-surface-container-highest active:bg-secondary-container transition-colors text-left group">
      <div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
        <span class="material-symbols-outlined text-3xl">map</span>
      </div>
      <div class="flex-1 flex flex-col">
        <span class="font-interactive-text text-interactive-text text-on-surface mb-1">Ruta trazada</span>
        <span class="font-body-md text-body-md text-on-surface-variant">Navegación a Centro Médico</span>
      </div>
      <div class="flex-shrink-0 text-on-surface-variant text-sm whitespace-nowrap">Ayer</div>
    </button>

    <div class="mt-md flex justify-center">
      <button onclick="if(confirm('¿Borrar todo el historial?')){localStorage.removeItem('simivoz_historial');this.textContent='HISTORIAL BORRADO';this.classList.add('bg-error-container','text-on-error-container');}" class="bg-primary-container text-on-primary-container font-interactive-text text-interactive-text px-xl py-sm rounded touch-target uppercase tracking-wide hover:bg-primary transition-colors active:scale-95 w-full md:w-auto">
        Borrar Historial
      </button>
    </div>
  </div>
</main>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 bg-background px-2 border-t-2 border-outline-variant">
  <a href="inicio.html" class="flex flex-col items-center justify-center text-on-surface-variant min-h-[44px] min-w-[64px] hover:bg-surface-container-highest rounded-lg active:scale-90 transition-all no-underline">
    <span class="material-symbols-outlined">home</span>
    <span class="font-label-lg text-label-lg mt-1">Inicio</span>
  </a>
  <a href="voz.html" class="flex flex-col items-center justify-center text-on-surface-variant min-h-[44px] min-w-[64px] hover:bg-surface-container-highest rounded-lg active:scale-90 transition-all no-underline">
    <span class="material-symbols-outlined">mic</span>
    <span class="font-label-lg text-label-lg mt-1">Voz</span>
  </a>
  <a href="lectura.html" class="flex flex-col items-center justify-center text-on-surface-variant min-h-[44px] min-w-[64px] hover:bg-surface-container-highest rounded-lg active:scale-90 transition-all no-underline">
    <span class="material-symbols-outlined">auto_stories</span>
    <span class="font-label-lg text-label-lg mt-1">Lectura</span>
  </a>
  <a href="servicios.html" class="flex flex-col items-center justify-center text-on-surface-variant min-h-[44px] min-w-[64px] hover:bg-surface-container-highest rounded-lg active:scale-90 transition-all no-underline">
    <span class="material-symbols-outlined">map</span>
    <span class="font-label-lg text-label-lg mt-1">Mapa</span>
  </a>
  <a href="configuracion.html" class="flex flex-col items-center justify-center text-on-surface-variant min-h-[44px] min-w-[64px] hover:bg-surface-container-highest rounded-lg active:scale-90 transition-all no-underline">
    <span class="material-symbols-outlined">settings</span>
    <span class="font-label-lg text-label-lg mt-1">Ajustes</span>
  </a>
</nav>
</body>
</html>
