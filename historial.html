<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Historial - SIMIVOZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  padding-bottom: 7rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.page-header h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

.page-header p {
  font-size: 0.95rem;
  color: var(--text-secondary);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  width: 100%;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 1.25rem;
  border-radius: 1rem;
  border: 1px solid var(--outline);
  background: var(--surface-container-low);
  transition: var(--transition-smooth);
  text-decoration: none;
  color: var(--text);
  text-align: left;
}

.history-item:hover {
  background: var(--surface-container-high);
  border-color: var(--primary);
}

.history-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.history-icon-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface-container-high);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--outline);
  transition: var(--transition-smooth);
}

.history-item:hover .history-icon-circle {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 0 10px var(--primary-glow);
  border-color: var(--primary);
}

.history-info {
  display: flex;
  flex-direction: column;
}

.history-info .item-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 0.15rem;
}

.history-info .item-meta {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.history-date {
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.7;
  white-space: nowrap;
}

.empty-state {
  text-align: center;
  padding: 3rem 1.5rem;
}

.empty-state p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin-top: 0.5rem;
}

.btn-clear-history {
  width: 100%;
  height: 52px;
  border: 1px solid var(--error);
  color: var(--error);
  background: var(--error-bg);
  border-radius: 0.85rem;
  font-family: var(--font-base);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 1rem;
}

.btn-clear-history:hover {
  background: var(--error);
  color: var(--on-error);
  box-shadow: 0 0 15px rgba(255, 180, 171, 0.4);
}

.btn-clear-history:active {
  transform: scale(0.97);
}

/* Modo simplificado updates */
body.modo-simplificado .history-item {
  padding: 1.25rem 1.5rem;
}
body.modo-simplificado .history-info .item-meta {
  display: none;
}
body.modo-simplificado .history-info .item-title {
  font-size: 1.25rem;
}
</style>
<script src="js/app.js"></script>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header">
  <div class="logo-wrapper">
    <button onclick="history.back()" class="btn-icon-header" style="border:none" aria-label="Volver atrás">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size: 1.25rem; margin-left: 0.5rem;">Historial</h1>
  </div>
</header>

<main>
  <div class="page-header">
    <h2>Actividad Reciente</h2>
    <p>Revisa o elimina tu historial de textos leídos por SIMIVOZ.</p>
  </div>

  <div class="history-list" id="history-container">
    <!-- Carga dinámica -->
  </div>

  <button class="btn-clear-history" id="clear-history-btn" onclick="clearHistory()" aria-label="Eliminar todo el historial de SIMIVOZ">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    <span>BORRAR TODO EL HISTORIAL</span>
  </button>
</main>

<nav class="unified-nav" aria-label="Navegación principal">
  <div class="unified-nav-inner">
    <a href="inicio.html" class="unified-nav-item" aria-label="Página de inicio">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="voz.html" class="unified-nav-item" aria-label="Asistente de voz">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span>Voz</span>
    </a>
    <a href="lectura.html" class="unified-nav-item" aria-label="Lector de textos">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Lectura</span>
    </a>
    <a href="servicios.html" class="unified-nav-item" aria-label="Mapa de servicios">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Mapa</span>
    </a>
    <a href="configuracion.html" class="unified-nav-item active" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ajustes</span>
    </a>
  </div>
</nav>

<div class="nav-spacer"></div>

<script>
function aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.body.classList.remove('big-font', 'massive-font')
        if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.body.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++' || config.fontSize === 'A+++') {
          document.body.classList.add('big-font', 'massive-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}

function renderHistory() {
  const container = document.getElementById('history-container')
  const clearBtn = document.getElementById('clear-history-btn')
  
  let historial = []
  try {
    historial = JSON.parse(localStorage.getItem('simivoz_historial') || '[]')
  } catch (e) {
    historial = []
  }

  if (historial.length === 0) {
    container.innerHTML = `
      <div class="empty-state glass-card">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
        <p>No tienes actividad registrada aún.</p>
      </div>
    `
    clearBtn.style.display = 'none'
    return
  }

  clearBtn.style.display = 'flex'
  container.innerHTML = ''
  
  historial.forEach(item => {
    // Al hacer clic, cargamos en el reproductor de audio directamente
    const link = document.createElement('a')
    link.href = 'lectura.html' // redirigir a lectura para editar o procesar
    link.className = 'history-item glass-card'
    link.setAttribute('aria-label', `Texto ${item.titulo} procesado el ${item.fecha}`)
    link.innerHTML = `
      <div class="history-left">
        <div class="history-icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="history-info">
          <span class="item-title">${item.titulo}</span>
          <span class="item-meta">Texto procesado</span>
        </div>
      </div>
      <span class="history-date">${item.fecha}</span>
    `
    container.appendChild(link)
  })
}

function clearHistory() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  if (confirm('¿Deseas eliminar todo tu historial de lecturas recientes?')) {
    localStorage.removeItem('simivoz_historial')
    
    window.speechSynthesis.cancel()
    var msg = new SpeechSynthesisUtterance('Historial borrado')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)

    renderHistory()
  }
}

document.addEventListener('DOMContentLoaded', function() {
  aplicarConfiguracion()
  renderHistory()
})

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
