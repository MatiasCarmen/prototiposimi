<html lang="es">
<head>

<!-- Leaflet.js CSS and JS from CDN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  padding: 1rem 1.25rem;
  padding-bottom: 7rem;
  gap: 1.25rem;
}

.search-section {
  width: 100%;
}

.search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}

.search-wrapper input {
  width: 100%;
  height: 52px;
  padding: 0 3.5rem 0 3rem;
  border-radius: 1rem;
  border: 1px solid var(--outline);
  background: var(--surface-container-low);
  color: var(--text);
  font-family: var(--font-base);
  font-size: 1rem;
  transition: var(--transition-smooth);
}

.search-wrapper input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
  background: var(--surface-container-high);
}

.search-wrapper input::placeholder {
  color: var(--text-secondary);
  opacity: 0.5;
}

.search-icon {
  position: absolute;
  left: 1rem;
  color: var(--text-secondary);
  pointer-events: none;
}

.voice-search-btn {
  position: absolute;
  right: 0.5rem;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary);
  border: none;
  border-radius: 50%;
  color: var(--on-primary);
  cursor: pointer;
  box-shadow: 0 2px 8px var(--primary-glow);
  transition: var(--transition-smooth);
}

.voice-search-btn:active {
  transform: scale(0.9);
}

.voice-search-btn.listening {
  background: var(--error);
  color: var(--on-error);
  animation: pulse-glow-btn 1.2s infinite;
}

@keyframes pulse-glow-btn {
  0%, 100% { box-shadow: 0 0 5px var(--error); }
  50% { box-shadow: 0 0 18px var(--error); }
}

/* Map area styling */
.map-container-wrapper {
  position: relative;
  width: 100%;
  height: 300px;
  border-radius: 1.25rem;
  overflow: hidden;
  border: 1px solid var(--surface-border);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
}

#map {
  width: 100%;
  height: 100%;
  background: var(--bg);
  z-index: 10;
}

.recenter-btn {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  width: 44px;
  height: 44px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 20;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  transition: var(--transition-smooth);
}

.recenter-btn:hover {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 0 15px var(--primary-glow);
}

.recenter-btn:active {
  transform: scale(0.9);
}

/* Categories cards */
.categories-section {
  width: 100%;
}

.categories-section h2 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 0.75rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}

.category-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.75rem;
}

@media (min-width: 600px) {
  .category-list {
    grid-template-columns: 1fr 1fr;
  }
}

.category-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 1rem 1.25rem;
  cursor: pointer;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  border-radius: 0.85rem;
  transition: var(--transition-smooth);
  text-align: left;
}

.category-btn:hover {
  background: var(--surface-container-high);
  border-color: var(--primary);
}

.category-btn.highlighted {
  border-color: var(--primary);
  background: rgba(0, 168, 84, 0.06);
  box-shadow: 0 0 12px var(--primary-glow);
}

.category-left {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.category-icon {
  width: 40px;
  height: 40px;
  background: var(--surface-container-high);
  color: var(--text-secondary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: var(--transition-smooth);
}

.category-btn.highlighted .category-icon, .category-btn:hover .category-icon {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

.category-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  transition: var(--transition-smooth);
}

.category-btn.highlighted .category-name {
  color: var(--primary);
}

.arrow-icon {
  color: var(--text-secondary);
  opacity: 0.5;
  transition: var(--transition-smooth);
}

.category-btn:hover .arrow-icon {
  color: var(--primary);
  opacity: 1;
  transform: translateX(4px);
}

/* Custom leaflet popup overrides */
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: var(--surface-solid) !important;
  color: var(--text) !important;
  border: 1px solid var(--primary) !important;
  box-shadow: 0 8px 30px var(--primary-glow) !important;
}

.leaflet-popup-close-button {
  color: var(--text-secondary) !important;
  padding: 8px 8px 0 0 !important;
}

/* Simplify overrides */
body.modo-simplificado .category-list {
  grid-template-columns: 1fr;
}
body.modo-simplificado .category-btn {
  padding: 1.25rem 1.5rem;
}
body.modo-simplificado .category-name {
  font-size: 1.25rem;
}
body.modo-simplificado .map-container-wrapper {
  height: 200px;
}
</style>
<script src="js/app.js"></script>

<script>
var map;
var currentCategory = 'farmacias';
var markersGroup;

// Coordenadas centrales de prueba: Miraflores, Lima (aprox -12.122, -77.028)
var defaultLat = -12.122;
var defaultLng = -77.028;

var serviciosData = {
  farmacias: [
    { name: "Farmacia Inkafarma Accesible", lat: -12.121, lng: -77.029, desc: "Farmacia con rampa de acceso antideslizante y atención con lenguaje de señas básico.", dist: "150 metros" },
    { name: "Farmacia Mifarma - Ingreso Nivelado", lat: -12.124, lng: -77.027, desc: "Ingreso sin escalones, pasadizos amplios y señalización visual de alta visibilidad.", dist: "350 metros" }
  ],
  hospitales: [
    { name: "Clínica Delgado - Centro de Urgencias", lat: -12.119, lng: -77.028, desc: "Hospital con accesibilidad universal completa, ascensores hablados y guías podotáctiles en el suelo.", dist: "450 metros" },
    { name: "Hospital de Emergencias Casimiro Ulloa", lat: -12.126, lng: -77.025, desc: "Rampas reglamentarias, personal capacitado y estacionamiento exclusivo para vehículos autorizados de personas con discapacidad.", dist: "600 metros" }
  ],
  supermercados: [
    { name: "Supermercado Wong - Accesibilidad Integral", lat: -12.122, lng: -77.031, desc: "Carritos de compra acoplables a sillas de ruedas, personal de asistencia preferencial.", dist: "300 metros" },
    { name: "Supermercado Metro Larco", lat: -12.125, lng: -77.030, desc: "Entrada a nivel de vereda, cajas preferenciales con altura adaptada y señalización accesible.", dist: "500 metros" }
  ],
  transporte: [
    { name: "Estación Metropolitano Benavides", lat: -12.123, lng: -77.026, desc: "Estación de tránsito con ascensores funcionales, puertas de embarque niveladas con los buses y anuncios por voz.", dist: "200 metros" },
    { name: "Paradero Larco Táctil", lat: -12.121, lng: -77.032, desc: "Paradero adaptado con baldosas de advertencia e información táctil y audible mediante código QR.", dist: "400 metros" }
  ]
};

function aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.documentElement.classList.remove('small-font', 'big-font', 'massive-font', 'ultra-font')
        if (config.fontSize === '0.75rem' || config.fontSize === '0.875rem' || config.fontSize === 'A-') {
          document.documentElement.classList.add('small-font')
        } else if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.documentElement.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++') {
          document.documentElement.classList.add('massive-font')
        } else if (config.fontSize === '1.4rem' || config.fontSize === '1.40rem' || config.fontSize === 'A+++') {
          document.documentElement.classList.add('ultra-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}

document.addEventListener('DOMContentLoaded', function() {
  aplicarConfiguracion();
  initMap();
});

function initMap() {
  // Inicializar Leaflet map
  map = L.map('map', {
    zoomControl: false
  }).setView([defaultLat, defaultLng], 15);
  
  // Agregar capa oscura de CartoDB (Dark Matter)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  markersGroup = L.layerGroup().addTo(map);
  
  // Cargar marcadores iniciales de Farmacias
  cargarMarcadores('farmacias');
}

function cargarMarcadores(categoria) {
  markersGroup.clearLayers();
  currentCategory = categoria;
  
  // Actualizar botones de filtro
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.classList.remove('highlighted');
  });
  const activeBtn = document.getElementById('btn-' + categoria);
  if (activeBtn) activeBtn.classList.add('highlighted');

  const data = serviciosData[categoria] || [];
  
  // Icono verde neón personalizado para Leaflet
  var customIcon = L.divIcon({
    className: 'custom-div-icon',
    html: `<div style="background-color: var(--primary); width: 18px; height: 18px; border-radius: 50%; border: 3.5px solid var(--surface-solid); box-shadow: 0 0 12px var(--primary);"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });

  data.forEach(item => {
    var marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(markersGroup);
    
    // Contenido del popup
    var popupContent = `
      <div style="font-family: var(--font-base); color: var(--text); background: var(--surface-solid); padding: 0.25rem; border-radius: 0.5rem; max-width: 220px;">
        <h4 style="color: var(--primary); font-weight:800; font-size: 0.95rem; margin-bottom:0.25rem;">${item.name}</h4>
        <p style="font-size:0.75rem; color: var(--text-secondary); margin-bottom:0.4rem; line-height: 1.3;">${item.desc}</p>
        <span style="font-size:0.75rem; font-weight:bold; color: var(--primary);">A: ${item.dist}</span>
      </div>
    `;
    
    marker.bindPopup(popupContent, {
      className: 'custom-leaflet-popup'
    });
    
    // Evento al hacer clic en el marcador
    marker.on('click', function() {
      if (window.navigator.vibrate) window.navigator.vibrate([40, 30, 40]);
      
      // Cancelar lecturas activas
      window.speechSynthesis.cancel();
      
      // Lectura por voz automatizada
      var ttsText = item.name + ", a una distancia de " + item.dist + ". " + item.desc;
      var utterance = new SpeechSynthesisUtterance(ttsText);
      utterance.lang = 'es-PE';
      window.speechSynthesis.speak(utterance);
    });
  });

  // Ajustar la vista para incluir los marcadores en pantalla
  if (data.length > 0) {
    var group = new L.featureGroup(markersGroup.getLayers());
    map.fitBounds(group.getBounds().pad(0.3));
  }
}

function recenterMap() {
  if (window.navigator.vibrate) window.navigator.vibrate(50);
  map.setView([defaultLat, defaultLng], 15);
  
  window.speechSynthesis.cancel();
  var msg = new SpeechSynthesisUtterance("Mapa centrado en tu ubicación actual");
  msg.lang = 'es-PE';
  window.speechSynthesis.speak(msg);
}

// Búsqueda por Voz interactiva
var voiceBtn = document.getElementById('voice-search-btn')
var isListening = false
var searchRecognition = null
var searchInput = document.getElementById('map-search-input')

voiceBtn.addEventListener('click', function() {
  if (window.navigator.vibrate) window.navigator.vibrate(50);
  if (isListening) {
    detenerBusquedaVoz()
  } else {
    iniciarBusquedaVoz()
  }
})

function iniciarBusquedaVoz() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance('Tu navegador no soporta búsqueda por voz')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
    return
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  searchRecognition = new SpeechRecognition()
  searchRecognition.lang = 'es-PE'
  searchRecognition.continuous = false
  searchRecognition.interimResults = false
  isListening = true
  
  voiceBtn.classList.add('listening')
  searchInput.placeholder = 'Escuchando tu voz...'

  window.speechSynthesis.cancel();
  var msg = new SpeechSynthesisUtterance('Di el tipo de servicio que deseas buscar')
  msg.lang = 'es-PE'
  window.speechSynthesis.speak(msg)

  searchRecognition.onresult = function(event) {
    var text = event.results[0][0].transcript.toLowerCase().trim();
    searchInput.value = text;
    
    window.speechSynthesis.cancel();
    var confirm = new SpeechSynthesisUtterance('Buscando ' + text)
    confirm.lang = 'es-PE'
    window.speechSynthesis.speak(confirm)
    
    // Filtrar marcadores automáticamente basado en la coincidencia del término
    if (text.includes('farma') || text.includes('medic') || text.includes('botica')) {
      cargarMarcadores('farmacias');
    } else if (text.includes('hospit') || text.includes('clin') || text.includes('medic') || text.includes('salud')) {
      cargarMarcadores('hospitales');
    } else if (text.includes('super') || text.includes('tienda') || text.includes('mercado') || text.includes('compr')) {
      cargarMarcadores('supermercados');
    } else if (text.includes('trans') || text.includes('bus') || text.includes('metropolitano') || text.includes('parader')) {
      cargarMarcadores('transporte');
    } else {
      // Búsqueda genérica en los nombres de servicios
      filtrarPorNombre(text);
    }
    
    detenerBusquedaVoz();
  }

  searchRecognition.onerror = function() {
    window.speechSynthesis.cancel();
    var err = new SpeechSynthesisUtterance('No se detectó voz. Por favor, intenta de nuevo')
    err.lang = 'es-PE'
    window.speechSynthesis.speak(err)
    detenerBusquedaVoz()
  }

  searchRecognition.onend = function() {
    detenerBusquedaVoz()
  }

  searchRecognition.start()
}

function detenerBusquedaVoz() {
  if (searchRecognition) {
    searchRecognition.stop()
    searchRecognition = null
  }
  isListening = false
  voiceBtn.classList.remove('listening')
  searchInput.placeholder = 'Buscar servicios...'
}

function filtrarPorNombre(text) {
  // Buscar en todos los datos
  var encontrado = false;
  for (var cat in serviciosData) {
    var coincidencias = serviciosData[cat].filter(item => 
      item.name.toLowerCase().includes(text) || item.desc.toLowerCase().includes(text)
    );
    if (coincidencias.length > 0) {
      // Cargar marcadores de esa categoría y enfocar
      cargarMarcadores(cat);
      encontrado = true;
      break;
    }
  }
  if (!encontrado) {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance('No se encontraron servicios relacionados con ' + text);
    msg.lang = 'es-PE';
    window.speechSynthesis.speak(msg);
  }
}

// Búsqueda por entrada de texto convencional
searchInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    var text = searchInput.value.toLowerCase().trim();
    if (text) {
      filtrarPorNombre(text);
    }
  }
});

// Detener síntesis al salir de la página
window.addEventListener('beforeunload', function() {
  window.speechSynthesis.cancel()
})

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
