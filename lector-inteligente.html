<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SIMIVOZ - Lector Inteligente</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#75ff9e",
        "primary-container": "#00e676",
        "primary-fixed": "#62ff96",
        "primary-fixed-dim": "#00e475",
        "on-primary": "#003918",
        "on-primary-container": "#00612e",
        "on-primary-fixed": "#00210b",
        "surface": "#121414",
        "surface-container": "#1e2020",
        "surface-container-high": "#282a2b",
        "surface-container-low": "#1a1c1c",
        "surface-container-lowest": "#0c0f0f",
        "surface-container-highest": "#333535",
        "surface-variant": "#333535",
        "on-surface": "#e2e2e2",
        "on-surface-variant": "#bacbb9",
        "outline": "#859585",
        "outline-variant": "#3b4a3d",
        "secondary-container": "#354d32",
        "on-secondary-container": "#a2bc9a",
        "background": "#121414",
        "on-background": "#e2e2e2",
        "tertiary-container": "#cac8c7",
        "inverse-surface": "#e2e2e2",
        "inverse-on-surface": "#2f3131",
        "surface-tint": "#00e475",
        "surface-dim": "#121414",
        "surface-bright": "#38393a",
        "error": "#ffb4ab",
        "error-container": "#93000a",
        "on-error": "#690005",
        "on-error-container": "#ffdad6"
      },
      borderRadius: {
        DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem"
      },
      spacing: {
        "touch-target-min": "44px", "xs": "0.5rem", "sm": "1rem", "md": "1.5rem", "lg": "2.5rem", "xl": "4rem",
        "margin-mobile": "1rem", "margin-desktop": "3rem", "gutter": "1.5rem", "base": "4px"
      },
      fontFamily: {
        "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"],
        "body-md": ["Inter"], "interactive-text": ["Inter"], "headline-lg-mobile": ["Inter"], "body-lg": ["Inter"]
      },
      fontSize: {
        "headline-md": ["1.5rem", { "lineHeight": "1.3", "fontWeight": "600" }],
        "headline-lg": ["2.25rem", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-lg": ["0.875rem", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
        "body-md": ["1rem", { "lineHeight": "1.5", "fontWeight": "400" }],
        "interactive-text": ["1.125rem", { "lineHeight": "1", "fontWeight": "700" }],
        "headline-lg-mobile": ["1.75rem", { "lineHeight": "1.2", "fontWeight": "700" }],
        "body-lg": ["1.125rem", { "lineHeight": "1.6", "fontWeight": "400" }]
      }
    }
  }
}
</script>
<style>
.ambient-glow {
  background: radial-gradient(circle at center, rgba(0, 230, 118, 0.15) 0%, transparent 70%);
  pointer-events: none;
}
body.modo-simplificado .simplified-hide { display: none !important; }
body.modo-simplificado .simplified-full-btn { height: 88px !important; font-size: 1.25rem !important; }

*:focus-visible {
  outline: 3px solid #75ff9e !important;
  outline-offset: 2px !important;
}
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">

<header class="w-full top-0 sticky border-b-2 border-outline-variant bg-background z-10 flex items-center justify-between px-margin-mobile h-touch-target-min">
  <div class="flex items-center gap-xs">
    <span class="material-symbols-outlined text-primary">accessibility_new</span>
    <h1 class="font-headline-md text-headline-md text-primary tracking-tight">SIMIVOZ</h1>
  </div>
</header>

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative">
  <div class="absolute inset-0 ambient-glow pointer-events-none"></div>

  <div class="z-10 flex flex-col items-center text-center max-w-md w-full">
    <div class="mb-xl relative w-32 h-32 flex items-center justify-center rounded-full bg-surface-container border-2 border-primary">
      <div class="absolute inset-0 bg-primary opacity-20 rounded-full animate-pulse"></div>
      <span class="material-symbols-outlined text-primary" style="font-size: 64px; font-variation-settings: 'FILL' 1;">menu_book</span>
    </div>

    <h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-md text-on-surface">Lector Inteligente</h2>
    <p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-sm">
      Escucha cualquier texto o documento con una voz natural y clara.
    </p>

    <div class="flex gap-sm mb-lg">
      <div class="w-3 h-3 rounded-full bg-primary ring-2 ring-primary ring-offset-2 ring-offset-background"></div>
      <div class="w-3 h-3 rounded-full bg-surface-container border border-outline-variant"></div>
      <div class="w-3 h-3 rounded-full bg-surface-container border border-outline-variant"></div>
    </div>
  </div>
</main>

<footer class="fixed bottom-0 w-full z-50 h-24 bg-surface-container border-t-2 border-primary flex justify-between items-center px-margin-mobile gap-gutter">
  <button onclick="omitirTutorial()" class="flex flex-col items-center justify-center text-on-surface-variant border-2 border-outline-variant rounded-full px-lg py-sm w-full mx-2 hover:opacity-90 active:scale-95 transition-transform h-touch-target-min">
    <span class="material-symbols-outlined mb-1">close</span>
    <span class="font-label-lg text-label-lg">OMITIR</span>
  </button>
  <a href="elegir-voz.html" class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-lg py-sm w-full mx-2 hover:opacity-90 active:scale-95 transition-transform h-touch-target-min no-underline">
    <span class="material-symbols-outlined mb-1">arrow_forward</span>
    <span class="font-label-lg text-label-lg">SIGUIENTE</span>
  </a>
</footer>

<script>
function omitirTutorial() {
  localStorage.setItem('simivoz_tutorial_completado', 'true')
  location.href = 'inicio.html'
}
</script>
</body>
</html>
