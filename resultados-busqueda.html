<meta charset="utf-8">

<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  padding-bottom: 7rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.search-header-box {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.search-header-box h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
}

.query-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--surface-container-high);
  border: 1px solid var(--outline);
  border-radius: 0.75rem;
  font-size: 0.9rem;
  font-style: italic;
  color: var(--text);
  width: max-content;
}

.results-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  width: 100%;
}

.result-card {
  display: flex;
  flex-direction: column;
  padding: 1.5rem;
  gap: 1.25rem;
}

@media (min-width: 500px) {
  .result-card {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

.result-left {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.result-icon-circle {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px var(--primary-glow);
}

.result-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.result-info h3 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 0.25rem;
}

.result-address {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.btn-go-action {
  height: 44px;
  font-size: 0.9rem;
  padding: 0 1.25rem;
  border-radius: 0.75rem;
}

.btn-back-map {
  width: 100%;
  height: 52px;
  border: 2px solid var(--primary);
  color: var(--primary);
  background: transparent;
  border-radius: 0.85rem;
  font-family: var(--font-base);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 1rem;
}

.btn-back-map:hover {
  background: rgba(0, 168, 84, 0.05);
  box-shadow: 0 0 15px var(--primary-glow);
}

.btn-back-map:active {
  transform: scale(0.97);
}

/* Modo simplificado */
body.modo-simplificado .result-card {
  padding: 1.25rem 1.5rem;
}
body.modo-simplificado .result-address {
  display: none;
}
body.modo-simplificado .result-info h3 {
  font-size: 1.35rem;
}
</style>
<script src="js/app.js"></script>

<script>
function aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.documentElement.classList.remove('small-font', 'big-font', 'massive-font', 'ultra-font')
        if (config.fontSize === '0.75rem' || config.fontSize === '0.875rem' || config.fontSize === 'A-') {
          document.documentElement.classList.add('small-font')
        } else if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.documentElement.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++') {
          document.documentElement.classList.add('massive-font')
        } else if (config.fontSize === '1.4rem' || config.fontSize === '1.40rem' || config.fontSize === 'A+++') {
          document.documentElement.classList.add('ultra-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}

document.addEventListener('DOMContentLoaded', function() {
  aplicarConfiguracion()
  
  var busqueda = localStorage.getItem('simivoz_busqueda')
  if (busqueda) {
    document.getElementById('search-query-display').textContent = '"' + busqueda + '"'
    
    window.speechSynthesis.cancel()
    var msg = new SpeechSynthesisUtterance('Mostrando resultados para ' + busqueda + '. Se encontraron 3 servicios cercanos.')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
  }
})

window.addEventListener('beforeunload', function() {
  window.speechSynthesis.cancel()
})

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
