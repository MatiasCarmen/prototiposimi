<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Bienvenido a SIMIVOZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  max-width: 460px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  z-index: 10;
  text-align: center;
}

.onboarding-card {
  width: 100%;
  padding: 2.25rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.welcome-icon-wrapper {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--surface-container-high);
  border: 2px solid var(--outline);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px var(--primary-glow);
  position: relative;
  animation: float 4s ease-in-out infinite;
}

.welcome-title {
  font-size: 2.1rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.welcome-desc {
  font-size: 0.95rem;
  color: var(--text-secondary);
  line-height: 1.45;
}

/* Dots indicator */
.steps-dots {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--outline);
  transition: var(--transition-smooth);
}

.dot.active {
  width: 24px;
  border-radius: 4px;
  background: var(--primary);
  box-shadow: 0 0 8px var(--primary);
}

/* Actions */
.onboarding-actions {
  display: flex;
  gap: 1rem;
  width: 100%;
  margin-top: 1rem;
}

.btn-onboard-secondary {
  flex: 1;
  height: 52px;
  border: 1px solid var(--outline);
  background: var(--surface-container-low);
  color: var(--text-secondary);
  border-radius: 99px;
  font-family: var(--font-base);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
}

.btn-onboard-secondary:hover {
  border-color: var(--primary);
  color: var(--text);
  background: rgba(0, 168, 84, 0.05);
}

.btn-onboard-primary {
  flex: 1.3;
  height: 52px;
}
</style>
<script src="js/app.js"></script>
</head>
<body class="haptic-press">

<div class="ambient-bg">
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
</div>

<header class="unified-header">
  <div class="logo-wrapper">
    <img src="assets/img/logoSimi.png" alt="Logo de SIMIVOZ">
    <h1>SIMIVOZ</h1>
  </div>
</header>

<main>
  <div class="onboarding-card glass-card">
    <div class="welcome-icon-wrapper">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><circle cx="12" cy="8" r="9" stroke="none"/></svg>
    </div>
    
    <div>
      <h2 class="welcome-title">Bienvenido</h2>
      <p class="welcome-desc">Tu asistente personal e inteligente para una accesibilidad sin límites en el mundo digital.</p>
    </div>

    <div class="steps-dots" aria-label="Paso 1 de 3 del tutorial">
      <div class="dot active" aria-current="step"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="onboarding-actions">
      <button onclick="omitirTutorial()" class="btn-onboard-secondary" aria-label="Omitir tutorial de inicio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>OMITIR</span>
      </button>
      <a href="lector-inteligente.html" class="btn-primary-action btn-onboard-primary no-underline" aria-label="Ir al siguiente paso del tutorial">
        <span>SIGUIENTE</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 SIMIVOZ - Ecosistema de Accesibilidad Contextual</p>
</footer>

<script>
function disabled_aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.body.classList.remove('big-font', 'massive-font')
        if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.body.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++' || config.fontSize === 'A+++') {
          document.body.classList.add('big-font', 'massive-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}
// old config listener disabled

function omitirTutorial() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  localStorage.setItem('simivoz_tutorial_completado', 'true')
  location.href = 'inicio.html'
}

document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
</body>
</html>
