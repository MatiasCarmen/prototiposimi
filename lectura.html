<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMIVOZ - Lector Dinámico</title>
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: var(--primary); margin-bottom: 1rem; }
    textarea { width: 100%; height: 300px; padding: 1rem; border: 2px solid var(--primary); border-radius: 0.5rem; background: var(--bg); color: var(--text); font-size: 1.125rem; }
    .controls { display: flex; gap: 1rem; margin-top: 1rem; }
    button { padding: 1rem 2rem; background: var(--primary); color: var(--on-primary); border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; min-height: var(--touch-min); }
    button:hover { background: #006b35; }
    input[type="file"] { margin-bottom: 1rem; color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lector Dinámico</h1>
    <input type="file" id="file-upload" accept=".txt">
    <textarea id="texto-contenido" placeholder="Carga un archivo o pega texto aquí..."></textarea>
    <div class="controls">
      <button onclick="reproducir()">LEER</button>
      <button onclick="pausar()">PAUSAR</button>
      <button onclick="detener()">DETENER</button>
    </div>
  </div>
  <script>
    let synth = window.speechSynthesis;
    let utterance;
    
    document.getElementById('file-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (e) => document.getElementById('texto-contenido').value = e.target.result;
      reader.readAsText(file);
    });

    function reproducir() {
      if (synth.speaking) synth.cancel();
      utterance = new SpeechSynthesisUtterance(document.getElementById('texto-contenido').value);
      utterance.lang = 'es-PE';
      synth.speak(utterance);
    }
    function pausar() { if (synth.speaking) synth.pause(); }
    function detener() { synth.cancel(); }
  </script>
</body>
</html>
