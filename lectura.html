<!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.page-title {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
}

.dropzone {
  border: 2px dashed var(--outline);
  border-radius: 1.25rem;
  padding: 2.25rem;
  text-align: center;
  background: rgba(0, 168, 84, 0.02);
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

.dropzone:hover, .dropzone.dragover {
  border-color: var(--primary);
  background: rgba(0, 168, 84, 0.07);
  box-shadow: 0 0 15px var(--primary-glow);
}

.dropzone svg {
  color: var(--primary);
  transition: var(--transition-smooth);
}

.dropzone:hover svg {
  transform: translateY(-4px);
}

.dropzone p {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.dropzone span {
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.7;
}

#file-upload {
  display: none;
}

.text-input-section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.text-input-section label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

textarea {
  width: 100%;
  height: 200px;
  padding: 1.25rem;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  border-radius: 1rem;
  color: var(--text);
  font-family: var(--font-base);
  font-size: 1rem;
  line-height: 1.5;
  resize: none;
  transition: var(--transition-smooth);
}

textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
  background: var(--surface-container-high);
}

textarea::placeholder {
  color: var(--text-secondary);
  opacity: 0.4;
}

.btn-read-action {
  width: 100%;
  height: 56px;
  margin-top: 0.5rem;
}
</style>
<script src="js/app.js"></script>
</head>

<main>
  <div class="dropzone glass-card" id="dropzone" onclick="document.getElementById('file-upload').click()">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p>Arrastra tu archivo .txt aquí</p>

    <input type="file" id="file-upload" accept=".txt">
  </div>

<script>
var selectedFileName = ''

function disabled_aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.documentElement.classList.remove('small-font', 'big-font', 'massive-font', 'ultra-font')
        if (config.fontSize === '0.75rem' || config.fontSize === '0.875rem' || config.fontSize === 'A-') {
          document.documentElement.classList.add('small-font')
        } else if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.documentElement.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++') {
          document.documentElement.classList.add('massive-font')
        } else if (config.fontSize === '1.4rem' || config.fontSize === '1.40rem' || config.fontSize === 'A+++') {
          document.documentElement.classList.add('ultra-font')
        }
      }
    }
  } catch (err) {
    console.error(err)
  }
}
// old config listener disabled

const dropzone = document.getElementById('dropzone')
const fileInput = document.getElementById('file-upload')
const textArea = document.getElementById('texto-contenido')

// Drag events
;['dragenter', 'dragover'].forEach(eventName => {
  dropzone.addEventListener(eventName, e => {
    e.preventDefault()
    dropzone.classList.add('dragover')
  }, false)
})
;['dragleave', 'drop'].forEach(eventName => {
  dropzone.addEventListener(eventName, e => {
    e.preventDefault()
    dropzone.classList.remove('dragover')
  }, false)
})

dropzone.addEventListener('drop', e => {
  const dt = e.dataTransfer
  const files = dt.files
  if (files.length) handleFile(files[0])
})

fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0])
})

function handleFile(file) {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  if (!file.name.endsWith('.txt')) {
    alert('Por favor, selecciona solo archivos de texto (.txt)')
    return
  }
  selectedFileName = file.name.replace('.txt', '')
  const reader = new FileReader()
  reader.onload = e => {
    textArea.value = e.target.result
    dropzone.querySelector('p').textContent = 'Archivo cargado: ' + file.name
    dropzone.querySelector('span').textContent = 'Haz clic para cambiar de archivo'
  }
  reader.readAsText(file)
}

function procesarLectura() {
  const content = textArea.value.trim()
  if (!content) {
    var msg = new SpeechSynthesisUtterance('Escribe o carga algún texto primero')
    msg.lang = 'es-PE'
    window.speechSynthesis.speak(msg)
    alert('Ingresa texto o carga un archivo antes de procesar.')
    return
  }

  const titulo = selectedFileName || 'Texto Personalizado'
  localStorage.setItem('simivoz_audio_titulo', titulo)
  localStorage.setItem('simivoz_audio_contenido', content)

  // Registrar en el historial local para la demo
  registrarHistorial(titulo)

  location.href = 'audio-player.html'
}

function registrarHistorial(titulo) {
  try {
    let historial = JSON.parse(localStorage.getItem('simivoz_historial') || '[]')
    const item = {
      id: Date.now(),
      titulo: titulo,
      fecha: new Date().toLocaleDateString('es-PE', { hour: '2-digit', minute: '2-digit' })
    }
    historial.unshift(item)
    // Mantener máximo 10
    if (historial.length > 10) historial.pop()
    localStorage.setItem('simivoz_historial', JSON.stringify(historial))
  } catch (err) {
    console.error(err)
  }
}

document.querySelectorAll('button, a, .dropzone').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
