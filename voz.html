<title>SIMIVOZ – Asistente de Voz</title>
<meta name="description" content="Controla SIMIVOZ con tu voz. Di comandos como 'buscar farmacia', 'ir a inicio' o 'leer documento' sin tocar la pantalla.">

<style>
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1.25rem 7rem;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  z-index: 10;
  gap: 1.5rem;
}

/* === STATUS === */
.status-section { text-align: center; }

.status-label {
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 0.35rem;
  min-height: 1.2em;
  transition: color 0.3s;
}

.status-hint {
  font-size: 0.92rem;
  color: var(--text-secondary);
  font-style: italic;
  min-height: 1.4em;
  transition: opacity 0.3s;
}

/* === COMMAND TOAST === */
.command-toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--primary);
  color: var(--on-primary);
  padding: 0.65rem 1.4rem;
  border-radius: 2rem;
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  box-shadow: 0 6px 20px var(--primary-glow);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  white-space: nowrap;
}

.command-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.command-toast.error-toast {
  background: var(--error);
  color: var(--on-error);
  box-shadow: 0 6px 20px rgba(192, 57, 43, 0.3);
}

/* === MIC ZONE === */
.mic-zone {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 220px;
  height: 220px;
  margin: 0.5rem 0;
}

.pulse-ring {
  position: absolute;
  width: 100px;
  height: 100px;
  border: 1.5px solid var(--primary);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  background: var(--primary-glow);
}

.pulse-ring.active {
  animation: pulse-ring-mic 2s cubic-bezier(0.25, 0, 0, 1) infinite;
}
.pulse-ring.delay-1 { animation-delay: 0.65s; }
.pulse-ring.delay-2 { animation-delay: 1.3s; }

@keyframes pulse-ring-mic {
  0%   { transform: scale(1);   opacity: 0.7; }
  100% { transform: scale(2.4); opacity: 0;   }
}

.mic-btn {
  position: relative;
  z-index: 10;
  width: 110px;
  height: 110px;
  background: var(--primary);
  color: var(--on-primary);
  border: 4px solid var(--surface-solid);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 30px var(--primary-glow);
  transition: var(--transition-smooth);
  touch-action: manipulation;
}

.mic-btn:hover   { transform: scale(1.06); box-shadow: 0 14px 38px var(--primary-glow); }
.mic-btn:active  { transform: scale(0.94); }
.mic-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.mic-btn.listening {
  background: var(--error);
  color: var(--on-error);
  box-shadow: 0 8px 30px rgba(192, 57, 43, 0.4);
  animation: pulse-btn-listening 1.4s ease-in-out infinite;
}

@keyframes pulse-btn-listening {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.09); }
}

.mic-btn svg { width: 38px; height: 38px; }

/* Icono alternativo (stop) cuando está escuchando */
.icon-stop { display: none; }
.mic-btn.listening .icon-mic  { display: none; }
.mic-btn.listening .icon-stop { display: block; }

/* === AUDIO VISUALIZER === */
.visualizer-wrapper {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 64px;
  gap: 4px;
  padding: 0 1rem;
}

.viz-bar {
  flex: 1;
  max-width: 8px;
  background: var(--outline);
  border-radius: 99px;
  height: 8px;
  transition: height 0.08s ease, background 0.3s;
}

.viz-bar.active {
  background: var(--primary);
  box-shadow: 0 0 6px var(--primary-glow);
}

/* === TRANSCRIPT === */
.transcript-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.transcript-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 0.25rem;
}

.transcript-header label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.clear-btn {
  background: none;
  border: none;
  color: var(--primary);
  font-family: var(--font-base);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-smooth);
  min-height: var(--touch-min);
  padding: 0 0.5rem;
}
.clear-btn:hover { text-decoration: underline; }

.transcript-box-wrapper {
  border-radius: 1rem;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  transition: var(--transition-smooth);
}

.transcript-box-wrapper.listening-active {
  border-color: var(--primary);
  box-shadow: 0 0 18px var(--primary-glow);
  background: var(--surface-container-high);
}

#transcript-box {
  width: 100%;
  height: 120px;
  background: transparent;
  border: none;
  padding: 1.25rem;
  font-family: var(--font-base);
  font-size: 1.05rem;
  color: var(--text);
  resize: none;
  outline: none;
  line-height: 1.5;
}

#transcript-box::placeholder {
  color: var(--text-secondary);
  opacity: 0.45;
}

/* interim text in grey italic */
.interim-overlay {
  padding: 0 1.25rem 0.75rem;
  font-size: 0.92rem;
  color: var(--text-secondary);
  font-style: italic;
  min-height: 1.2em;
  transition: opacity 0.2s;
}

.volume-bar {
  height: 5px;
  background: var(--outline-variant);
  width: 100%;
  position: relative;
}

.volume-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-container));
  box-shadow: 0 0 8px var(--primary);
  width: 0%;
  transition: width 0.08s linear;
}

/* === COMMANDS GRID === */
.commands-grid {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.commands-title {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding: 0 0.25rem;
}

.commands-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

@media (max-width: 380px) {
  .commands-list { grid-template-columns: 1fr; }
}

.cmd-chip {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 0.75rem;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
  transition: var(--transition-smooth);
  text-align: left;
  font-family: var(--font-base);
  color: var(--text);
}

.cmd-chip:hover, .cmd-chip:focus-visible {
  border-color: var(--primary);
  background: var(--surface-container-high);
  box-shadow: 0 4px 14px var(--primary-glow);
  transform: translateY(-1px);
}

.cmd-chip:active {
  transform: scale(0.97);
}

.cmd-chip-icon {
  width: 32px;
  height: 32px;
  background: rgba(0, 168, 84, 0.10);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cmd-chip-icon svg {
  width: 16px;
  height: 16px;
  stroke: var(--primary);
}

.cmd-chip-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.cmd-chip-label {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cmd-chip-example {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-style: italic;
}

/* === NO SUPPORT BANNER === */
.no-support-banner {
  width: 100%;
  padding: 1.25rem;
  border-radius: 1rem;
  background: var(--error-bg);
  border: 1px solid var(--error);
  color: var(--error);
  font-weight: 700;
  text-align: center;
  display: none;
}

/* === SIMPLIFICADO === */
body.modo-simplificado .cmd-chip-example { display: none; }
body.modo-simplificado .cmd-chip-label   { font-size: 1rem; }
body.modo-simplificado .commands-list    { grid-template-columns: 1fr; }
</style>

<script>
/* ==========================================================
   SIMIVOZ – Asistente de Voz (voz.html) — v2.0
   Mejoras respecto a v1:
   1. Reconocimiento de una orden por toque para evitar bucles de escucha
   2. Visualizador de audio real con AudioContext + AnalyserNode
   3. Texto interino diferenciado del texto final
   4. Toast visual + TTS confirmación de comandos
   5. Comandos expandidos (leer, historial, registro, silenciar)
   6. Comandos clickables en las chips para demo/presentación
   7. Botón mute TTS sin romper el reconocimiento
   8. Manejo de errores específicos (no-speech, network, denied)
   9. Idioma alineado a es-PE para el demo
  10. Limpieza correcta en beforeunload
   ========================================================== */

// ——— Config ———
var VOICE_LANG = 'es-PE';
var TTS_ENABLED = true;
var isListening = false;
var recognition = null;
var audioCtx = null;
var analyser = null;
var micStream = null;
var vizBars = [];
var vizRaf = null;

// ——— DOM ———
var micBtn           = document.getElementById('mic-btn');
var transcriptBox    = document.getElementById('transcript-box');
var transcriptCont   = document.getElementById('transcript-container');
var voiceStatus      = document.getElementById('voice-status');
var voiceHint        = document.getElementById('voice-hint');
var volumeMeter      = document.getElementById('volume-meter');
var clearBtn         = document.getElementById('clear-btn');
var cmdToast         = document.getElementById('cmd-toast');
var interimText      = document.getElementById('interim-text');
var noSupportBanner  = document.getElementById('no-support-banner');
var btnTtsToggle     = document.getElementById('btn-tts-toggle');
var iconTtsOn        = document.getElementById('icon-tts-on');
var iconTtsOff       = document.getElementById('icon-tts-off');
var rings            = [
  document.getElementById('ring-1'),
  document.getElementById('ring-2'),
  document.getElementById('ring-3')
];

function setTtsEnabled(enabled, persist) {
  TTS_ENABLED = Boolean(enabled);
  if (!TTS_ENABLED && window.speechSynthesis) window.speechSynthesis.cancel();

  iconTtsOn.style.display  = TTS_ENABLED ? 'block' : 'none';
  iconTtsOff.style.display = TTS_ENABLED ? 'none'  : 'block';
  btnTtsToggle.setAttribute('aria-label', TTS_ENABLED ? 'Silenciar voz del asistente' : 'Activar voz del asistente');
  btnTtsToggle.title = TTS_ENABLED ? 'Silenciar asistente' : 'Activar asistente';

  if (persist !== false) {
    try {
      var config = JSON.parse(localStorage.getItem('simivoz_config')) || {};
      config.ttsEnabled = TTS_ENABLED;
      localStorage.setItem('simivoz_config', JSON.stringify(config));
    } catch(e) {}
  }
}

// ——— Aplicar config de accesibilidad ———
(function disabled_aplicarConfiguracion() {
  try {
    var config = JSON.parse(localStorage.getItem('simivoz_config'));
    if (!config) return;
    if (config.contrast)   document.body.classList.add('high-contrast');
    if (config.simplified) document.body.classList.add('modo-simplificado');
    if (config.ttsEnabled === false) {
      setTtsEnabled(false, false);
    }
    if (config.fontSize) {
      document.documentElement.classList.remove('small-font', 'big-font', 'massive-font', 'ultra-font');
      var fs = config.fontSize;
      if (fs === '0.75rem' || fs === '0.875rem' || fs === 'A-') {
        document.documentElement.classList.add('small-font');
      } else if (fs === '1.125rem' || fs === '1.15rem' || fs === 'A+') {
        document.documentElement.classList.add('big-font');
      } else if (fs === '1.25rem' || fs === '1.3rem' || fs === 'A++') {
        document.documentElement.classList.add('massive-font');
      } else if (fs === '1.4rem' || fs === '1.40rem' || fs === 'A+++') {
        document.documentElement.classList.add('ultra-font');
      }
    }
  } catch (e) { /* ignore */ }
})();

// ——— Botón mute TTS ———
btnTtsToggle.addEventListener('click', function() {
  if (window.navigator.vibrate) window.navigator.vibrate(40);
  setTtsEnabled(!TTS_ENABLED);
  showToast(TTS_ENABLED ? '🔊 Voz activada' : '🔇 Voz silenciada', false);
});

// ——— Generador de barras del visualizador ———
(function buildVisualizer() {
  var container = document.getElementById('visualizer');
  for (var i = 0; i < 20; i++) {
    var bar = document.createElement('div');
    bar.className = 'viz-bar';
    container.appendChild(bar);
    vizBars.push(bar);
  }
})();

// ——— TTS helper ———
function speak(text) {
  if (!TTS_ENABLED || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE_LANG;
  u.rate = 0.98;
  window.speechSynthesis.speak(u);
}

// ——— Toast helper ———
var toastTimer = null;
function showToast(text, isError) {
  cmdToast.textContent = text;
  cmdToast.className = 'command-toast visible' + (isError ? ' error-toast' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    cmdToast.classList.remove('visible');
  }, 2800);
}

// ——— Actualizar estado visual ———
function setListeningState(active) {
  isListening = active;
  micBtn.classList.toggle('listening', active);
  transcriptCont.classList.toggle('listening-active', active);
  rings.forEach(function(r) { r.classList.toggle('active', active); });
  micBtn.setAttribute('aria-label', active ? 'Detener asistente de voz' : 'Iniciar asistente de voz');
  volumeMeter.style.width = '0%';
  if (!active) {
    interimText.textContent = '';
    stopVisualizer();
  }
}

// ——— AudioContext Visualizer ———
function startVisualizer() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  if (audioCtx) return; // ya iniciado

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(function(stream) {
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      var source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      var dataArray = new Uint8Array(analyser.frequencyBinCount);

      function drawFrame() {
        if (!isListening) return;
        vizRaf = requestAnimationFrame(drawFrame);
        analyser.getByteFrequencyData(dataArray);

        var step = Math.floor(dataArray.length / vizBars.length);
        vizBars.forEach(function(bar, i) {
          var val = dataArray[i * step] || 0;
          var h = Math.max(4, (val / 255) * 52);
          bar.style.height = h + 'px';
          bar.classList.toggle('active', val > 20);
        });

        // Volume meter (RMS)
        var sum = 0;
        for (var i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
        var avg = sum / dataArray.length;
        volumeMeter.style.width = Math.min(100, (avg / 255) * 200) + '%';
      }

      drawFrame();
    })
    .catch(function() {
      // getUserMedia bloqueado (ya lo maneja recognition.onerror)
    });
}

function stopVisualizer() {
  cancelAnimationFrame(vizRaf);
  vizBars.forEach(function(bar) {
    bar.style.height = '8px';
    bar.classList.remove('active');
  });
  if (micStream) {
    micStream.getTracks().forEach(function(t) { t.stop(); });
    micStream = null;
  }
  if (audioCtx) {
    audioCtx.close().catch(function(){});
    audioCtx = null;
    analyser  = null;
  }
}

// ——— Mapa de destinos de navegación ———
var DESTINOS = {
  'inicio':        'inicio.html',
  'home':          'inicio.html',
  'voz':           'voz.html',
  'micrófono':     'voz.html',
  'microfono':     'voz.html',
  'asistente':     'voz.html',
  'lectura':       'lectura.html',
  'leer':          'lectura.html',
  'documento':     'lectura.html',
  'libro':         'lectura.html',
  'mapa':          'servicios.html',
  'servicios':     'servicios.html',
  'servicio':      'servicios.html',
  'ajustes':       'configuracion.html',
  'configuracion': 'configuracion.html',
  'configuración': 'configuracion.html',
  'ayuda':         'ayuda.html',
  'historial':     'historial.html',
};

// ——— Procesador de comandos ———
function processCommand(text) {
  var cmd = text.toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');  // quitar tildes para matching

  // 1) Detener asistente
  if (/^(detener|parar|para|stop|cancela|silencio)/.test(cmd)) {
    showToast('⏹ Asistente detenido');
    speak('Deteniendo');
    if (recognition && isListening) {
      try { recognition.stop(); } catch(e) {}
    }
    setListeningState(false);
    return true;
  }

  // 2) Activar o silenciar la respuesta hablada
  if (/^(silenciar voz|silencia voz|sin voz|mute|callate)/.test(cmd)) {
    setTtsEnabled(false);
    showToast('🔇 Voz silenciada');
    return true;
  }

  if (/^(activar voz|activa voz|con voz|sonido|habla)/.test(cmd)) {
    setTtsEnabled(true);
    showToast('🔊 Voz activada');
    speak('Voz activada');
    return true;
  }

  // 3) Registro demo
  if (/^(registrar|registrarme|registro|crear cuenta|crear usuario)/.test(cmd)) {
    showToast('📝 Abriendo registro');
    speak('Abriendo registro');
    setTimeout(function() { location.href = 'registrarse.html'; }, 1200);
    return true;
  }

  // 4) Buscar servicio
  var buscarMatch = cmd.match(/^(buscar|encuentra|donde hay|necesito|quiero|busca)\s+(.+)/);
  if (buscarMatch) {
    var termino = buscarMatch[2].trim();
    localStorage.setItem('simivoz_busqueda', termino);
    showToast('🔍 Buscando: ' + termino);
    speak('Buscando ' + termino);
    setTimeout(function() { location.href = 'resultados-busqueda.html'; }, 1600);
    return true;
  }

  // 5) Navegar a sección
  var navMatch = cmd.match(/^(ir a|abrir|navegar a|abre|ve a|llévame a|llevame a)\s+(.+)/);
  if (navMatch) {
    var destino = navMatch[2].trim();
    var url = null;
    for (var key in DESTINOS) {
      if (destino.includes(key)) { url = DESTINOS[key]; break; }
    }
    if (url) {
      showToast('📍 Abriendo: ' + destino);
      speak('Abriendo ' + destino);
      setTimeout(function() { location.href = url; }, 1400);
    } else {
      showToast('❓ Destino no encontrado: ' + destino, true);
      speak('No encontré el destino ' + destino + '. Prueba diciendo ir a inicio, mapa o ajustes.');
    }
    return true;
  }

  // 6) Leer / abrir lector
  if (/^(leer|lee|lector|documento|libro|texto)/.test(cmd)) {
    showToast('📖 Abriendo lector');
    speak('Abriendo el lector inteligente');
    setTimeout(function() { location.href = 'lectura.html'; }, 1400);
    return true;
  }

  // 7) Limpiar transcripción
  if (/^(limpiar|borrar|borra|limpia)/.test(cmd)) {
    transcriptBox.value = '';
    showToast('🗑 Transcripción limpiada');
    speak('Transcripción limpiada');
    return true;
  }

  // 8) Repetir / ayuda
  if (/^(ayuda|comandos|que puedo decir|que puedo hacer|que digo)/.test(cmd)) {
    speak('Puedes decir: buscar farmacia, abrir mapa, leer documento, ir a historial, silenciar voz o detener.');
    showToast('💬 Comandos leídos');
    return true;
  }

  return false; // no fue un comando reconocido
}

// ——— SpeechRecognition Setup ———
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = VOICE_LANG;
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  recognition.onstart = function() {
    setListeningState(true);
    voiceStatus.textContent = 'Escuchando…';
    voiceHint.textContent = 'Di un comando o habla libremente';
    startVisualizer();
    if (window.navigator.vibrate) window.navigator.vibrate([40, 30, 40]);
    showToast('Escuchando comando');
  };

  recognition.onresult = function(event) {
    var interim = '';
    var final_  = '';

    for (var i = event.resultIndex; i < event.results.length; i++) {
      var t = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        final_ += t;
      } else {
        interim += t;
      }
    }

    // Mostrar texto interino en gris
    interimText.textContent = interim ? '…' + interim : '';

    if (final_) {
      interimText.textContent = '';
      transcriptBox.value += (transcriptBox.value ? ' ' : '') + final_.trim();
      transcriptBox.scrollTop = transcriptBox.scrollHeight;

      if (recognition && isListening) {
        try { recognition.stop(); } catch(e) {}
      }

      // Intentar procesar como comando
      var handled = processCommand(final_);
      if (!handled) {
        voiceStatus.textContent = 'Comando no reconocido';
        voiceHint.textContent = 'Prueba con "buscar farmacia", "abrir mapa" o "leer documento".';
        showToast('No reconocí ese comando', true);
        speak('No reconocí ese comando');
      }
    }
  };

  recognition.onend = function() {
    setListeningState(false);
    voiceStatus.textContent = 'Listo para escuchar';
    voiceHint.textContent = 'Presiona el micrófono o di un comando';
  };

  recognition.onerror = function(event) {
    var msg = '';
    switch(event.error) {
      case 'no-speech':
        msg = 'No detecté voz. Toca el micrófono e intenta de nuevo.';
        break;
      case 'audio-capture':
        msg = 'Sin micrófono detectado';
        break;
      case 'not-allowed':
        msg = 'Permiso de micrófono denegado';
        noSupportBanner.style.display = 'block';
        noSupportBanner.textContent = '🔒 Sin permiso de micrófono. Haz clic en el candado del navegador para permitirlo.';
        break;
      case 'network':
        msg = 'Sin conexión — reconocimiento en pausa';
        break;
      default:
        msg = 'Error: ' + event.error;
    }
    voiceStatus.textContent = msg;
    showToast('⚠️ ' + msg, true);
    setListeningState(false);
    voiceHint.textContent = 'Presiona el micrófono para reintentar';
  };

} else {
  // Navegador no compatible
  micBtn.disabled = true;
  noSupportBanner.style.display = 'block';
  voiceStatus.textContent = 'Navegador no compatible';
  voiceHint.textContent = 'Usa Google Chrome para esta función';
}

// ——— Botón micrófono ———
micBtn.addEventListener('click', function() {
  if (window.navigator.vibrate) window.navigator.vibrate(50);
  if (!recognition) return;

  if (isListening) {
    try { recognition.stop(); } catch(e) {}
    speak('Asistente desactivado');
  } else {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    try { recognition.start(); } catch(e) {
      showToast('El micrófono ya se está iniciando', true);
    }
  }
});

// ——— Botón limpiar ———
clearBtn.addEventListener('click', function() {
  if (window.navigator.vibrate) window.navigator.vibrate(40);
  transcriptBox.value = '';
  interimText.textContent = '';
  showToast('🗑 Transcripción limpiada');
});

// ——— Chips de comandos: toca para ejecutar ———
document.querySelectorAll('.cmd-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(40);
    var cmd = this.getAttribute('data-cmd');
    if (!cmd) return;
    // Simular ingreso del comando
    transcriptBox.value += (transcriptBox.value ? ' ' : '') + cmd;
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
    processCommand(cmd);
  });
});

// ——— Haptic en todos los botones/links ———
document.querySelectorAll('button, a').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(40);
  });
});

// ——— Limpieza al salir ———
window.addEventListener('beforeunload', function() {
  window.speechSynthesis.cancel();
  stopVisualizer();
  if (recognition && isListening) {
    try { recognition.abort(); } catch(e) {}
  }
});
</script>

</body>
