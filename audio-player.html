<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Audio Player - SIMIVOZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<style>
main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding-bottom: 7rem;
}

.player-card {
  width: 100%;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.player-status {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.audio-title-box {
  width: 100%;
  padding: 0.75rem 1.25rem;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  border-radius: 0.75rem;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Soundwave visualizer */
.wave-visualizer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 100px;
  width: 100%;
  margin: 1.5rem 0;
  transition: var(--transition-smooth);
}

.wave-visualizer .bar {
  width: 5px;
  height: 12px;
  background-color: var(--outline);
  border-radius: 99px;
  transition: height 0.25s ease, background-color 0.3s;
}

.wave-visualizer.playing .bar {
  background-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
  animation: bounce 1.2s ease-in-out infinite alternate;
}

.wave-visualizer.playing .bar:nth-child(1) { animation-delay: 0.1s; animation-duration: 0.8s; }
.wave-visualizer.playing .bar:nth-child(2) { animation-delay: 0.3s; animation-duration: 1.1s; }
.wave-visualizer.playing .bar:nth-child(3) { animation-delay: 0.5s; animation-duration: 0.9s; }
.wave-visualizer.playing .bar:nth-child(4) { animation-delay: 0.2s; animation-duration: 1.3s; }
.wave-visualizer.playing .bar:nth-child(5) { animation-delay: 0.6s; animation-duration: 0.7s; }
.wave-visualizer.playing .bar:nth-child(6) { animation-delay: 0.4s; animation-duration: 1.2s; }
.wave-visualizer.playing .bar:nth-child(7) { animation-delay: 0.8s; animation-duration: 0.9s; }
.wave-visualizer.playing .bar:nth-child(8) { animation-delay: 0.1s; animation-duration: 1.4s; }
.wave-visualizer.playing .bar:nth-child(9) { animation-delay: 0.3s; animation-duration: 0.8s; }
.wave-visualizer.playing .bar:nth-child(10) { animation-delay: 0.5s; animation-duration: 1.1s; }
.wave-visualizer.playing .bar:nth-child(11) { animation-delay: 0.2s; animation-duration: 1.3s; }
.wave-visualizer.playing .bar:nth-child(12) { animation-delay: 0.7s; animation-duration: 0.9s; }
.wave-visualizer.playing .bar:nth-child(13) { animation-delay: 0.4s; animation-duration: 0.7s; }
.wave-visualizer.playing .bar:nth-child(14) { animation-delay: 0.6s; animation-duration: 1.2s; }

@keyframes bounce {
  0% { height: 12px; }
  100% { height: 70px; }
}

/* Progress bar container */
.progress-container {
  width: 100%;
  margin-bottom: 2rem;
}

.time-stamps {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--surface-container-low);
  border: 1px solid var(--outline);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--primary);
  box-shadow: 0 0 8px var(--primary-glow);
  transition: width 0.1s linear;
}

/* Controls Grid */
.controls-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  width: 100%;
}

.btn-control-secondary {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--surface-container-high);
  border: 1px solid var(--outline);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.btn-control-secondary:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(0, 168, 84, 0.05);
}

.btn-control-secondary span.control-label {
  font-size: 0.55rem;
  font-weight: 700;
  margin-top: 2px;
  text-transform: uppercase;
}

.btn-control-main {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px var(--primary-glow);
  transition: var(--transition-smooth);
}

.btn-control-main:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0, 168, 84, 0.45);
}

.btn-control-main:active {
  transform: scale(0.95);
}

.btn-control-danger {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--error-bg);
  border: 1px solid var(--error);
  color: var(--error);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.btn-control-danger:hover {
  background: var(--error);
  color: var(--on-error);
  box-shadow: 0 0 15px rgba(255, 180, 171, 0.4);
}

/* Modo Simplificado updates */
body.modo-simplificado .controls-container {
  gap: 1.5rem;
}
body.modo-simplificado .btn-control-secondary {
  width: 64px;
  height: 64px;
}
body.modo-simplificado .btn-control-main {
  width: 90px;
  height: 90px;
}
body.modo-simplificado .btn-control-danger {
  width: 72px;
  height: 72px;
}
</style>
<script src="js/app.js"></script>

<script>
var synth = window.speechSynthesis
var utterance = null
var isPlaying = false
var velocidad = 1.0
var volumenActivo = true
var progressInterval = null
var startTime = 0
var elapsedTime = 0 // Tiempo acumulado reproducido
var totalDuration = 15 // Duración estimada para la demo

var titulo = localStorage.getItem('simivoz_audio_titulo') || 'Guía de Accesibilidad Avanzada'
var contenido = localStorage.getItem('simivoz_audio_contenido') || 'No hay contenido para reproducir. Vuelve a la sección de lectura.'

// Calcular duración aproximada basada en la cantidad de palabras (aprox 150 palabras por minuto)
const wordsCount = contenido.trim().split(/\s+/).length
totalDuration = Math.max(Math.ceil(wordsCount / 2.5), 10) // Mínimo 10 segundos

document.getElementById('audio-title').textContent = titulo
document.getElementById('totalTime').textContent = formatoTiempo(totalDuration)

function disabled_aplicarConfiguracion() {
  try {
    const config = JSON.parse(localStorage.getItem('simivoz_config'))
    if (config) {
      if (config.contrast) document.body.classList.add('high-contrast')
      if (config.simplified) document.body.classList.add('modo-simplificado')
      if (config.fontSize) {
        document.documentElement.classList.remove('small-font', 'big-font', 'massive-font', 'ultra-font')
        if (config.fontSize === '0.75rem' || config.fontSize === '0.875rem' || config.fontSize === 'A-') {
          document.documentElement.classList.add('small-font')
        } else if (config.fontSize === '1.125rem' || config.fontSize === '1.15rem' || config.fontSize === 'A+') {
          document.documentElement.classList.add('big-font')
        } else if (config.fontSize === '1.25rem' || config.fontSize === '1.3rem' || config.fontSize === 'A++') {
          document.documentElement.classList.add('massive-font')
        } else if (config.fontSize === '1.4rem' || config.fontSize === '1.40rem' || config.fontSize === 'A+++') {
          document.documentElement.classList.add('ultra-font')
        }
      }
      if (config.speed) {
        velocidad = parseFloat(config.speed)
        document.getElementById('speedDisplay').textContent = velocidad.toFixed(1) + 'x'
      }
    }
  } catch (err) {
    console.error(err)
  }
}
// old config listener disabled

function togglePlayPause() {
  if (isPlaying) {
    pausar()
  } else {
    reproducir()
  }
}

function reproducir() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  
  if (synth.speaking && synth.paused) {
    synth.resume()
    isPlaying = true
    document.getElementById('player-status-text').textContent = 'Reproduciendo'
    document.getElementById('playPauseIcon').innerHTML = '<rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />' // Pause icon SVG
    document.getElementById('wave-container').classList.add('playing')
    iniciarProgreso()
    return
  }

  if (synth.speaking) {
    synth.cancel()
  }

  // Cortar texto desde donde nos quedamos si fue detenido/pausado
  // Para la demo, el SpeechSynthesis de JS estándar reanuda correctamente, pero si hay problemas creamos un nuevo utterance
  const porcentajeAvance = elapsedTime / totalDuration
  const indexInicio = Math.floor(contenido.length * porcentajeAvance)
  const textoRestante = contenido.substring(indexInicio)

  utterance = new SpeechSynthesisUtterance(textoRestante || contenido)
  utterance.lang = 'es-PE'
  utterance.rate = velocidad
  utterance.volume = volumenActivo ? 1 : 0

  utterance.onstart = function() {
    isPlaying = true
    document.getElementById('player-status-text').textContent = 'Reproduciendo'
    document.getElementById('playPauseIcon').innerHTML = '<rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />' // Pause icon SVG
    document.getElementById('wave-container').classList.add('playing')
    startTime = Date.now() - (elapsedTime * 1000 / velocidad) // Ajustar tiempo de inicio según velocidad y tiempo transcurrido
    iniciarProgreso()
  }

  utterance.onend = function() {
    // Si terminó de verdad y no fue cancelado
    if (isPlaying) {
      isPlaying = false
      elapsedTime = totalDuration
      document.getElementById('player-status-text').textContent = 'Finalizado'
      document.getElementById('playPauseIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>' // Play icon SVG
      document.getElementById('wave-container').classList.remove('playing')
      detenerProgreso()
      document.getElementById('progressBar').style.width = '100%'
      document.getElementById('currentTime').textContent = formatoTiempo(totalDuration)
      elapsedTime = 0
    }
  }

  utterance.onpause = function() {
    isPlaying = false
    document.getElementById('player-status-text').textContent = 'Pausado'
    document.getElementById('playPauseIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>' // Play icon SVG
    document.getElementById('wave-container').classList.remove('playing')
    detenerProgreso()
  }

  utterance.onerror = function(e) {
    console.error('Error de TTS:', e)
    detener()
  }

  synth.speak(utterance)
}

function pausar() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  if (synth.speaking && !synth.paused) {
    synth.pause()
    isPlaying = false
    document.getElementById('player-status-text').textContent = 'Pausado'
    document.getElementById('playPauseIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>' // Play icon
    document.getElementById('wave-container').classList.remove('playing')
    detenerProgreso()
  }
}

function detener() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  synth.cancel()
  isPlaying = false
  elapsedTime = 0
  document.getElementById('player-status-text').textContent = 'Detenido'
  document.getElementById('playPauseIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>' // Play icon
  document.getElementById('wave-container').classList.remove('playing')
  document.getElementById('progressBar').style.width = '0%'
  document.getElementById('currentTime').textContent = '00:00'
  detenerProgreso()
}

function cambiarVelocidad() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  var opts = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
  var i = opts.indexOf(velocidad)
  velocidad = opts[(i + 1) % opts.length]
  document.getElementById('speedDisplay').textContent = velocidad.toFixed(1) + 'x'
  
  if (synth.speaking) {
    // Si está hablando, pausamos, recalculamos elapsedTime, cancelamos y volvemos a reproducir con la nueva velocidad
    const hablando = isPlaying
    synth.cancel()
    if (hablando) {
      setTimeout(reproducir, 100)
    }
  }
}

function adelantar() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  elapsedTime = Math.min(elapsedTime + 5, totalDuration)
  document.getElementById('currentTime').textContent = formatoTiempo(Math.floor(elapsedTime))
  document.getElementById('progressBar').style.width = (elapsedTime / totalDuration * 100) + '%'
  
  if (synth.speaking) {
    synth.cancel()
    if (isPlaying) {
      setTimeout(reproducir, 100)
    }
  }
}

function toggleVolumen() {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  volumenActivo = !volumenActivo
  document.getElementById('volumeIcon').innerHTML = volumenActivo 
    ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>'
    : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
  document.getElementById('volDisplay').textContent = volumenActivo ? 'ON' : 'OFF'
  if (utterance) utterance.volume = volumenActivo ? 1 : 0
}

function jumpProgress(e) {
  if (window.navigator.vibrate) window.navigator.vibrate(50)
  const rect = e.currentTarget.getBoundingClientRect()
  const clickX = e.clientX - rect.left
  const width = rect.width
  const clickPct = clickX / width
  elapsedTime = Math.floor(clickPct * totalDuration)
  
  document.getElementById('currentTime').textContent = formatoTiempo(elapsedTime)
  document.getElementById('progressBar').style.width = (clickPct * 100) + '%'
  
  if (synth.speaking) {
    synth.cancel()
    if (isPlaying) {
      setTimeout(reproducir, 100)
    }
  }
}

function iniciarProgreso() {
  detenerProgreso()
  progressInterval = setInterval(function() {
    if (isPlaying) {
      // Calcular el tiempo transcurrido en base a la velocidad
      elapsedTime += 0.25 * velocidad
      if (elapsedTime >= totalDuration) {
        elapsedTime = totalDuration
        detenerProgreso()
      }
      var pct = Math.min((elapsedTime / totalDuration) * 100, 100)
      document.getElementById('progressBar').style.width = pct + '%'
      document.getElementById('currentTime').textContent = formatoTiempo(Math.floor(elapsedTime))
    }
  }, 250)
}

function detenerProgreso() {
  if (progressInterval) clearInterval(progressInterval)
  progressInterval = null
}

function formatoTiempo(seg) {
  var m = Math.floor(seg / 60)
  var s = Math.floor(seg % 60)
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s
}

// Detener TTS al salir de la página
window.addEventListener('beforeunload', function() {
  synth.cancel()
})

document.querySelectorAll('button, .progress-track').forEach(function(el) {
  el.addEventListener('click', function() {
    if (window.navigator.vibrate) window.navigator.vibrate(50)
  })
})
</script>
